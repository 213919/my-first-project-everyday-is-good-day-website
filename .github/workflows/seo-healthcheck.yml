name: SEO 健檢（每兩週）

# 每月 1 號與 15 號 01:17 UTC（台灣時間約 09:17）自動執行 ≈ 每兩週一次
# 也可在 Actions 頁面手動觸發
on:
  schedule:
    - cron: "17 1 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行 SEO 健檢
        id: audit
        run: |
          set +e
          python3 seo-healthcheck.py > report.txt
          code=$?
          set -e
          cat report.txt
          echo "high_count=$code" >> "$GITHUB_OUTPUT"

      - name: 寫入執行摘要
        if: always()
        run: |
          {
            echo "## 📋 SEO 健檢報告　$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 有高嚴重度問題時開 Issue 通知
        if: always() && steps.audit.outputs.high_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 SEO 健檢發現待修問題（${today}）`,
              body: '自動健檢偵測到高嚴重度問題，請處理：\n\n```\n' + report + '\n```',
              labels: ['seo', 'automated'],
            });
