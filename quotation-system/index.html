<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRT 報價 / 訂單確認系統</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand" onclick="showView('list')">
      <span class="brand-logo">GRT</span>
      <span class="brand-name">報價 / 訂單確認系統</span>
    </div>
    <nav>
      <button class="nav-btn" id="nav-list" onclick="showView('list')">文件列表</button>
      <button class="nav-btn" id="nav-new-qu" onclick="newDoc('QU')">＋ 報價單</button>
      <button class="nav-btn" id="nav-new-cu" onclick="newDoc('CU')">＋ 訂單確認單</button>
      <button class="nav-btn folder-btn" id="btn-set-folder" onclick="setFolder()" title="設定存檔資料夾">
        📁 <span id="folder-label">選擇存檔資料夾</span>
      </button>
    </nav>
  </header>

  <!-- 列表頁 -->
  <main id="view-list" class="view active">
    <div class="page-header">
      <h1>文件列表</h1>
      <div class="header-actions">
        <input type="text" id="search-input" placeholder="搜尋單號或客戶名稱..." oninput="renderList()">
        <select id="filter-type" onchange="renderList()">
          <option value="">全部類型</option>
          <option value="QU">報價單</option>
          <option value="CU">訂單確認單</option>
        </select>
      </div>
    </div>
    <div id="list-empty" class="empty-state" style="display:none">
      <p>尚無文件，點擊上方「＋ 報價單」或「＋ 訂單確認單」開始建立</p>
    </div>
    <div id="list-table-wrap" class="table-wrapper">
      <table class="main-table">
        <thead>
          <tr>
            <th>類型</th><th>單號</th><th>客戶名稱</th><th>日期</th><th>幣別</th><th>總計</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="list-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 表單頁 -->
  <main id="view-form" class="view">
    <div class="page-header">
      <h1 id="form-title">新增報價單</h1>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="showView('list')">取消</button>
        <button class="btn btn-primary" onclick="saveAndPreview()">儲存並預覽</button>
      </div>
    </div>

    <form id="doc-form">
      <input type="hidden" id="f-id">
      <input type="hidden" id="f-type">

      <!-- 文件資訊 -->
      <section class="form-section">
        <h2>文件資訊</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>單號 <span class="req">*</span></label>
            <input type="text" id="f-number" required>
          </div>
          <div class="form-group">
            <label>幣別 <span class="req">*</span></label>
            <select id="f-currency" onchange="onCurrencyChange()">
              <option value="NTD">NTD（新台幣）</option>
              <option value="USD">USD（美元）</option>
            </select>
          </div>
          <div class="form-group">
            <label>日期 <span class="req">*</span></label>
            <input type="date" id="f-date" required>
          </div>
          <!-- QU only -->
          <div class="form-group qu-only">
            <label>報價有效期（天）</label>
            <input type="number" id="f-validity" value="10" min="1">
          </div>
          <!-- CU only -->
          <div class="form-group cu-only">
            <label>付款期限（天）</label>
            <input type="number" id="f-payment-days" value="7" min="1">
          </div>
          <div class="form-group">
            <label>稅金</label>
            <div class="tax-row">
              <input type="checkbox" id="f-apply-tax" onchange="recalc()">
              <label for="f-apply-tax" style="font-weight:normal">含稅 5%</label>
            </div>
          </div>
        </div>
      </section>

      <!-- 客戶資訊 -->
      <section class="form-section">
        <h2>客戶資訊</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>客戶名稱 <span class="req">*</span></label>
            <input type="text" id="f-client-name" required>
          </div>
          <div class="form-group">
            <label>客戶代碼</label>
            <input type="text" id="f-client-code" placeholder="例：R210059">
          </div>
          <div class="form-group">
            <label>聯絡人</label>
            <input type="text" id="f-client-contact">
          </div>
          <div class="form-group">
            <label>電話</label>
            <input type="text" id="f-client-phone">
          </div>
          <div class="form-group full-width">
            <label>地址</label>
            <input type="text" id="f-client-address">
          </div>
        </div>
      </section>

      <!-- 品項明細 -->
      <section class="form-section">
        <h2>品項明細</h2>
        <div class="items-wrap">
          <table class="items-table">
            <thead>
              <tr>
                <th style="width:3%">項次</th>
                <th style="width:42%">品名</th>
                <th style="width:8%">數量</th>
                <th style="width:12%">單價</th>
                <th style="width:12%">總價</th>
                <th class="qu-only" style="width:15%">Lead time</th>
                <th class="cu-only" style="width:15%">出貨日期</th>
                <th style="width:5%"></th>
              </tr>
            </thead>
            <tbody id="items-tbody"></tbody>
          </table>
        </div>
        <button type="button" class="btn btn-outline btn-sm" onclick="addItem()" style="margin-top:10px">＋ 新增品項</button>

        <div class="totals">
          <div class="totals-row"><span>合　計</span><span id="t-subtotal">0</span></div>
          <div class="totals-row" id="tax-row"><span>稅　金（5%）</span><span id="t-tax">0</span></div>
          <div class="totals-row total-row"><span>總　計</span><span id="t-total">0</span></div>
        </div>
      </section>

      <!-- 備註 -->
      <section class="form-section">
        <h2>備註</h2>
        <div class="form-group">
          <textarea id="f-notes" rows="5" readonly class="notes-readonly"></textarea>
        </div>
        <p class="hint">備註為固定格式，付款天數與幣別設定後自動更新</p>
      </section>
    </form>
  </main>

  <!-- 預覽頁 -->
  <main id="view-preview" class="view">
    <div class="page-header no-print">
      <h1 id="preview-title">預覽</h1>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="showView('list')">返回列表</button>
        <button class="btn btn-outline" id="btn-edit" onclick="editCurrent()">編輯</button>
        <button class="btn btn-success" onclick="exportExcel()">匯出 Excel</button>
        <button class="btn btn-primary" onclick="window.print()">列印 / PDF</button>
      </div>
    </div>
    <div id="preview-body"></div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
