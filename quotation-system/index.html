<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報價系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 主選單列 -->
  <header class="topbar">
    <div class="topbar-brand" onclick="showView('list')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10,9 9,9 8,9"/>
      </svg>
      <span>報價系統</span>
    </div>
    <nav class="topbar-nav">
      <button class="nav-btn active" id="nav-list" onclick="showView('list')">報價單列表</button>
      <button class="nav-btn" id="nav-new" onclick="newQuote()">＋ 新增報價單</button>
    </nav>
  </header>

  <!-- 列表頁 -->
  <main id="view-list" class="view active">
    <div class="page-header">
      <h1>報價單列表</h1>
      <div class="header-actions">
        <input type="text" id="search-input" placeholder="搜尋客戶名稱或報價單號..." oninput="renderList()">
        <select id="filter-status" onchange="renderList()">
          <option value="">全部狀態</option>
          <option value="draft">草稿</option>
          <option value="sent">已發送</option>
          <option value="accepted">已接受</option>
          <option value="rejected">已婉拒</option>
        </select>
      </div>
    </div>

    <div id="quote-list-empty" class="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
      </svg>
      <p>尚無報價單，點擊「新增報價單」開始建立</p>
      <button class="btn btn-primary" onclick="newQuote()">新增第一張報價單</button>
    </div>

    <div id="quote-list-table" class="table-wrapper">
      <table class="quote-table">
        <thead>
          <tr>
            <th>報價單號</th>
            <th>客戶名稱</th>
            <th>報價日期</th>
            <th>有效期限</th>
            <th>金額</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="quote-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 新增/編輯頁 -->
  <main id="view-edit" class="view">
    <div class="page-header">
      <h1 id="edit-title">新增報價單</h1>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="showView('list')">取消</button>
        <button class="btn btn-primary" onclick="saveQuote()">儲存</button>
      </div>
    </div>

    <form id="quote-form" class="quote-form">
      <input type="hidden" id="edit-id">

      <!-- 基本資訊 -->
      <section class="form-section">
        <h2>基本資訊</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="f-number">報價單號 <span class="required">*</span></label>
            <input type="text" id="f-number" placeholder="例：QT-2026-001" required>
          </div>
          <div class="form-group">
            <label for="f-status">狀態</label>
            <select id="f-status">
              <option value="draft">草稿</option>
              <option value="sent">已發送</option>
              <option value="accepted">已接受</option>
              <option value="rejected">已婉拒</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-date">報價日期 <span class="required">*</span></label>
            <input type="date" id="f-date" required>
          </div>
          <div class="form-group">
            <label for="f-valid-until">有效期限</label>
            <input type="date" id="f-valid-until">
          </div>
        </div>
      </section>

      <!-- 客戶資訊 -->
      <section class="form-section">
        <h2>客戶資訊</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="f-client-name">客戶名稱 <span class="required">*</span></label>
            <input type="text" id="f-client-name" placeholder="公司或個人名稱" required>
          </div>
          <div class="form-group">
            <label for="f-client-contact">聯絡人</label>
            <input type="text" id="f-client-contact" placeholder="聯絡人姓名">
          </div>
          <div class="form-group">
            <label for="f-client-email">電子信箱</label>
            <input type="email" id="f-client-email" placeholder="example@email.com">
          </div>
          <div class="form-group">
            <label for="f-client-phone">電話</label>
            <input type="tel" id="f-client-phone" placeholder="02-1234-5678">
          </div>
          <div class="form-group full-width">
            <label for="f-client-address">地址</label>
            <input type="text" id="f-client-address" placeholder="客戶地址">
          </div>
        </div>
      </section>

      <!-- 項目明細 -->
      <section class="form-section">
        <h2>項目明細</h2>
        <div class="items-table-wrapper">
          <table class="items-table">
            <thead>
              <tr>
                <th style="width:40%">品項名稱</th>
                <th style="width:20%">說明</th>
                <th style="width:10%">數量</th>
                <th style="width:10%">單位</th>
                <th style="width:13%">單價</th>
                <th style="width:12%">小計</th>
                <th style="width:5%"></th>
              </tr>
            </thead>
            <tbody id="items-tbody"></tbody>
          </table>
        </div>
        <button type="button" class="btn btn-outline btn-sm add-item-btn" onclick="addItem()">＋ 新增品項</button>

        <!-- 合計區 -->
        <div class="totals">
          <div class="totals-row">
            <label>小計</label>
            <span id="t-subtotal">NT$ 0</span>
          </div>
          <div class="totals-row">
            <label>折扣 (%)</label>
            <input type="number" id="f-discount" min="0" max="100" value="0" oninput="recalc()" class="totals-input">
          </div>
          <div class="totals-row">
            <label>稅率 (%)</label>
            <input type="number" id="f-tax" min="0" max="100" value="5" oninput="recalc()" class="totals-input">
          </div>
          <div class="totals-row totals-total">
            <label>總計</label>
            <span id="t-total">NT$ 0</span>
          </div>
        </div>
      </section>

      <!-- 備註 -->
      <section class="form-section">
        <h2>備註 / 條款</h2>
        <div class="form-group">
          <textarea id="f-notes" rows="4" placeholder="付款條件、交貨期、其他說明..."></textarea>
        </div>
      </section>
    </form>
  </main>

  <!-- 預覽頁 -->
  <main id="view-preview" class="view">
    <div class="page-header no-print">
      <h1>報價單預覽</h1>
      <div class="header-actions">
        <button class="btn btn-outline" id="btn-back-to-list" onclick="showView('list')">返回列表</button>
        <button class="btn btn-outline" id="btn-edit-from-preview" onclick="editFromPreview()">編輯</button>
        <button class="btn btn-primary" onclick="window.print()">列印 / 匯出 PDF</button>
      </div>
    </div>

    <div class="quote-preview" id="quote-preview-content">
      <!-- 由 JS 動態產生 -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
