<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#1b1e24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="聲讀">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>聲讀｜每日全球政經科技</title>
<style>
:root{color-scheme:dark;--bg:#1b1e24;--card:#363c46;--sheet:#2b3038;--fg:#fff;--mute:#aeb6c0;--line:#ffffff1f;--accent:#9fd3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
a{color:#c6e7ff}
svg{display:block;fill:currentColor}
.ico{width:26px;height:26px}
.shell{max-width:460px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* ---------- 播放器 ---------- */
.player{background:var(--card);border-radius:26px;padding:14px 20px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0007}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{padding:6px;border-radius:10px}
.brand{font-size:13px;color:var(--mute);letter-spacing:2px}
.chev{transition:transform .2s}
.compact-on .chev{transform:rotate(180deg)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.paper{position:relative;border-radius:24px;background:linear-gradient(#fff,#eaeef2);color:#11151a;display:flex;flex-direction:column;overflow:hidden;-webkit-touch-callout:none}
.tagrow{padding:14px 18px 0;display:flex;gap:8px;align-items:center;min-height:30px;font-size:12px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid currentColor}
.t-全球政治{color:#b4452f}.t-全球經濟{color:#9a6b00}.t-全球科技{color:#2b64b0}.t-對台灣的影響{color:#2c7a4b}
.script{position:relative;height:280px;height:clamp(170px,calc(100dvh - 450px),380px);overflow:auto;overscroll-behavior:contain;padding:10px 18px 14px;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 12px),transparent)}
.compact-on .script{height:110px}
.para{margin:0 0 12px;font-size:19px;line-height:1.75;font-weight:600;color:#7a838e}
.plabel{display:block;font-size:11.5px;font-weight:600;letter-spacing:1px;color:#a0a8b1;margin-bottom:1px}
.s{cursor:pointer;transition:color .2s}
.s.past{color:#aab2bb}
.s.active{color:#4d5763}
.s.active .r{color:#11151a}
.para.intro{font-size:15px;font-weight:600;color:#5a6470}
.para.notice{font-size:15px;line-height:1.6;color:#8a5a00;background:#fff4d6;border-radius:12px;padding:8px 12px}
.para.notice .s.active,.para.notice .s.active .r{color:#5c3c00}
.para.source{font-size:15px;line-height:1.6;font-weight:500}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:30px;padding:0 18px 10px;flex:none}
.wave i{display:block;width:3px;height:100%;border-radius:2px;background:#232a33;transform:scaleY(var(--h));opacity:.5}
.is-playing .wave i{animation:eq 1s ease-in-out infinite alternate;animation-delay:var(--d);opacity:.9}
@keyframes eq{from{transform:scaleY(calc(var(--h)*.35))}to{transform:scaleY(var(--h))}}
.info h1{font-size:17px;line-height:1.45;margin:0;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.srcs{font-size:12.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.srcs::-webkit-scrollbar{display:none}
.srcs a{text-decoration:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#ffffff80;border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:#ffffff80;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.pos{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-6px}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ctl .side{justify-self:center;min-width:48px;height:44px;border-radius:12px;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ctl .side[aria-pressed=true]{color:var(--accent)}
.mid{display:flex;align-items:center;gap:14px}
.mid .skip{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
#play{width:58px;height:58px;border-radius:50%;background:#fff;color:#1b1e24;display:grid;place-items:center}
#play svg{width:30px;height:30px}
.siri{align-self:center;font-size:13px;color:var(--accent);padding:2px 8px}
.status{font-size:12.5px;line-height:1.7;margin:0;color:#ffd88a}
.status:empty{display:none}

/* ---------- 四大板塊（每列左右滑動） ---------- */
.news{margin-top:24px}
.news-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 4px}
.news-head h2{font-size:21px;margin:0}
.news-head small{color:var(--mute);font-size:12.5px}
.shelf{margin:18px 0 2px}
.shelf-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.shelf-head b{font-size:17px}
.shelf-head .all{margin-left:auto;color:var(--accent);font-size:13.5px;font-weight:600;padding:6px 2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-全球政治{background:#ffb4a2}.d-全球經濟{background:#ffd88a}.d-全球科技{background:#9cc9ff}.d-對台灣的影響{background:#9fe0b4}
.track{position:relative;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:12px;padding:4px 12px 12px;margin:0 -12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
@media(hover:hover) and (pointer:fine){.track{scrollbar-width:thin;scrollbar-color:#ffffff40 transparent}.track::-webkit-scrollbar{display:block;height:6px}.track::-webkit-scrollbar-thumb{background:#ffffff40;border-radius:3px}}
.card{flex:0 0 min(74%,280px);scroll-snap-align:start;background:var(--sheet);border:1px solid #ffffff14;border-radius:20px;overflow:hidden;display:flex}
.card.playing{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card-main{display:flex;flex-direction:column;width:100%;text-align:left}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;background:#3a4250}
.thumb img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px 14px;font-size:20px;font-weight:700;color:#fff}
.g-全球政治{background:linear-gradient(135deg,#7a3a2c,#3b2433)}
.g-全球經濟{background:linear-gradient(135deg,#7a5a1f,#3b3022)}
.g-全球科技{background:linear-gradient(135deg,#2a5590,#22283f)}
.g-對台灣的影響{background:linear-gradient(135deg,#25664a,#1f3330)}
.now{position:absolute;z-index:2;right:10px;top:10px;display:none;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent);color:#10222b}
.now i{display:inline-block;width:2px;height:10px;background:currentColor;border-radius:1px;margin-right:1px}
.card.playing .now{display:flex}
.is-playing .card.playing .now i{animation:eqs .7s ease-in-out infinite alternate}
.now i:nth-child(2){animation-delay:.2s}.now i:nth-child(3){animation-delay:.4s}
@keyframes eqs{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.pbtn{position:absolute;z-index:2;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:#fff;color:#1b1e24;display:grid;place-items:center;box-shadow:0 4px 14px #0006}
.pbtn svg{width:19px;height:19px}
.cbody{display:block;padding:10px 14px 14px}
.cmeta{display:block;font-size:12px;color:var(--mute)}
.ctitle{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15.5px;line-height:1.5;font-weight:650;margin:4px 0}
.csum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.6;color:#c3cad2}
.skel{flex-direction:column}
.skel .thumb,.skel .sk{background:linear-gradient(90deg,#ffffff0d 25%,#ffffff1f 50%,#ffffff0d 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}
.sk{display:block;height:12px;border-radius:6px;margin:12px 14px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{color:var(--mute);text-align:center;padding:30px 0;font-size:14px}

/* ---------- 迷你播放列 ---------- */
.mini{position:fixed;z-index:15;left:0;right:0;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),440px);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:18px;background:#2b3038f0;border:1px solid #ffffff1f;box-shadow:0 12px 32px #000a;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.mini.show{transform:none;visibility:visible;transition:transform .25s ease}
.mini-main{flex:1;min-width:0;text-align:left}
.mini-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-main small{color:var(--mute);font-size:12px}
.mini .mp{width:42px;height:42px;border-radius:50%;background:#fff;color:#1b1e24;display:grid;place-items:center;flex:none}
.mini .mp svg{width:22px;height:22px}
.mini .mn{width:40px;height:40px;display:grid;place-items:center;flex:none}
@media(min-width:520px){.shell{padding-top:28px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
<section class="player" id="player" aria-label="新聞播放器">
  <div class="top">
    <button id="collapse" aria-label="收合／展開逐字稿" aria-expanded="true"><svg class="ico chev" viewBox="0 0 24 24"><path d="M3.5 8.5 12 17l8.5-8.5-1.4-1.4L12 14.2 4.9 7.1z"/></svg></button>
    <span class="brand">聲讀 DAILY</span>
    <button id="refresh" aria-label="重新整理新聞"><svg class="ico" viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
  </div>

  <div class="paper">
    <div class="tagrow" id="tagrow"></div>
    <div class="script" id="script"><p class="para"><span class="s">新聞載入中…</span></p></div>
    <div class="wave" id="wave" aria-hidden="true"></div>
  </div>

  <div class="info">
    <h1 id="title">今日全球重點新聞</h1><small id="meta">等待新聞載入</small><div class="srcs" id="srcs"></div>
  </div>

  <div>
    <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="句子進度">
    <div class="pos"><span id="position"></span><span id="eta"></span></div>
  </div>

  <div class="ctl" id="ctl">
    <button class="side" id="rateBtn" aria-label="切換語速">1.0x</button>
    <div class="mid">
      <button class="skip" id="prev" aria-label="上一則"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button id="play" aria-label="播放"></button>
      <button class="skip" id="next" aria-label="下一則"><svg class="ico" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <button class="side" id="loop" aria-label="循環播放" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
  <button class="siri" id="siri">🎧 改用 iPhone 的 Siri 聲音朗讀 ›</button>
  <p id="audio" class="status" role="status"></p>
</section>

<section class="news" id="news" aria-labelledby="newsHead">
  <div class="news-head"><h2 id="newsHead">今日重點</h2><small id="newsStatus">載入中…</small></div>
  <div id="shelves"></div>
</section>
</div>

<div class="mini" id="mini" role="region" aria-label="正在播放">
  <button class="mini-main" id="miniMain" aria-label="回到播放器"><b id="miniTitle"></b><small id="miniMeta"></small></button>
  <button class="mp" id="miniPlay" aria-label="播放"></button>
  <button class="mn" id="miniNext" aria-label="下一則"><svg class="ico" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
</div>

<script src="/rules.js"></script>
<script>
'use strict';
const R=window.NewsRules;
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
const CATS=R.CATS,PER=R.PER_CAT;
const SECTION_NAME={'全球政治':'全球政治重點','全球經濟':'全球經濟重點','全球科技':'全球科技重點','對台灣的影響':'對台灣影響的相關新聞'};
const RATES=[0.8,1,1.2,1.4],CACHE_KEY='news-v6',TR_KEY='news-tr-v1';
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MAXU=IOS?220:100; /* 同一段的句子合併成一次朗讀（最多幾個字），減少句子之間的停頓 */
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)'),smooth=()=>reduceMotion.matches?'auto':'smooth';

let articles=[],queue=[],idx=0,sents=[],sentence=0,mode='idle',token=0,voice=null,loading=false,loadedOnce=false,watchdog,
    current=null,lastCancel=0,loop=false,rate=1,speechPrimed=false,ctlVisible=true,autoQueue=true,queueKey='',lastUpdated=0;

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* 狀態列只顯示需要注意的訊息 */
function status(t,warn){$('audio').textContent=warn?t:''}
const isPlaying=()=>mode==='playing'||mode==='starting';
const hm=t=>new Date(t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});

/* ---------- iPhone 靜音模式也能播放 ----------
   1. navigator.audioSession.type='playback'（iOS 16.4+）：宣告本頁是媒體播放
   2. 朗讀時同時循環一段無聲音軌，讓系統以「影音播放」處理本頁聲音（需在點擊當下啟動） */
const hasAudioSession=!!(navigator.audioSession&&'type' in navigator.audioSession);
let keep=null;
function setPlaybackSession(){try{if(hasAudioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}}
setPlaybackSession();
function silentWav(){
  const sr=16000,n=sr/2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf); /* 0.5 秒 16-bit 單聲道無聲 */
  const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function keepStart(){
  try{
    if(!keep){keep=new Audio(silentWav());keep.loop=true;keep.preload='auto';keep.setAttribute('playsinline','')}
    if(keep.paused){const p=keep.play();if(p&&p.catch)p.catch(()=>{})}
  }catch(e){}
}
function keepStop(){try{if(keep&&!keep.paused)keep.pause()}catch(e){}}
/* 在點擊當下呼叫：啟動媒體播放模式、解鎖語音引擎 */
function prime(){
  setPlaybackSession();keepStart();
  if(synth&&!speechPrimed){speechPrimed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;synth.speak(u)}catch(e){}}
}

/* ---------- 語音：iPhone 不開放網頁使用 Siri 聲音；固定使用系統國語（台灣）語音，有高品質版本時優先 ---------- */
const inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger|MQQBrowser|; wv\)/i.test(navigator.userAgent);
function pickVoice(){
  if(!synth)return;
  const zh=synth.getVoices().filter(v=>/^zh|^cmn/i.test(v.lang));
  const tw=zh.filter(v=>/TW|Hant/i.test(v.lang)),pool=tw.length?tw:zh.filter(v=>!/HK|yue/i.test(v.lang));
  voice=pool.find(v=>/premium|enhanced|增強|優化|高品質/i.test(v.name+' '+(v.voiceURI||'')))||pool.find(v=>v.localService)||pool[0]||null;
}
if(synth){
  pickVoice();synth.addEventListener('voiceschanged',pickVoice);
  let tries=0;const poll=setInterval(()=>{if(voice||++tries>10)clearInterval(poll);else pickVoice()},500); /* 語音清單常延遲才出現 */
}else status('此瀏覽器不支援語音朗讀，請改用 Safari。',true);
if(inApp)status('偵測到 App 內建瀏覽器，可能無法發聲；請改用 Safari 開啟。',true);

/* ---------- 語速、循環 ---------- */
rate=store.get('news-rate',1);loop=store.get('news-loop',false);
function paintRate(){$('rateBtn').textContent=rate.toFixed(1)+'x'}
function paintLoop(){$('loop').setAttribute('aria-pressed',String(loop))}
paintRate();paintLoop();
$('rateBtn').onclick=()=>{const i=RATES.indexOf(rate);rate=RATES[(i+1)%RATES.length];store.set('news-rate',rate);paintRate();eta()};
$('loop').onclick=()=>{loop=!loop;store.set('news-loop',loop);paintLoop()};

/* ---------- 逐字稿 ---------- */
function setPlayIcon(on){
  for(const b of [$('play'),$('miniPlay')]){b.innerHTML=on?ICON_PAUSE:ICON_PLAY;b.setAttribute('aria-label',on?'暫停':'播放')}
  document.body.classList.toggle('is-playing',on);
}
setPlayIcon(false);
function halt(){token++;clearTimeout(watchdog);if(synth){synth.cancel();lastCancel=Date.now()}}
const ABBR=[[/TechNews/gi,'科技新報'],[/\bAI\b/g,'人工智慧'],[/\bGDP\b/g,'國內生產毛額'],[/\bETF\b/g,'指數股票型基金'],
 [/\bFed\b/g,'聯準會'],[/\bIMF\b/g,'國際貨幣基金'],[/\bWTO\b/g,'世界貿易組織'],[/\bOPEC\+?/g,'石油輸出國組織'],
 [/\bNATO\b/g,'北約'],[/\bEU\b/g,'歐盟'],[/\bUN\b/g,'聯合國'],[/\bUSA?\b/g,'美國'],[/\bG7\b/g,'七大工業國集團'],
 [/\bG20\b/g,'二十國集團'],[/\bCPI\b/g,'消費者物價指數'],[/\bECB\b/g,'歐洲央行'],[/\bIPO\b/g,'首次公開募股'],
 [/\bEV\b/g,'電動車'],[/\bNVIDIA\b/gi,'輝達'],[/\bTSMC\b/g,'台積電'],[/\bWHO\b/g,'世界衛生組織']];
function spoken(s){ABBR.forEach(([r,t])=>{s=s.replace(r,t)});return s.replace(/\s+/g,' ').trim()}
function ago(t){
  if(!t)return'';const m=Math.round((Date.now()-t)/6e4);
  if(m<1)return'剛剛';if(m<60)return m+' 分鐘前';if(m<1440)return Math.round(m/60)+' 小時前';return Math.round(m/1440)+' 天前';
}
function eta(){
  const chars=sents.slice(sentence).reduce((n,s)=>n+s.text.length,0),sec=Math.round(chars/(4.2*rate));
  $('eta').textContent=sents.length?'約剩 '+(sec>=60?Math.floor(sec/60)+' 分 ':'')+(sec%60)+' 秒':'';
}
function paintMeta(){const a=queue[idx];if(!a)return;$('meta').textContent=`${a.source}${a.time?' · '+ago(a.time):''} · ${idx+1}/${queue.length}`;paintMini()}
/* 原文連結：主要來源＋相關報導 */
function paintSources(a){

  [{source:a.source,link:a.link}].concat(a.related||[]).forEach(r=>{
    if(!r.link||seen.has(r.link)||!/^https?:\/\//i.test(r.link))return;seen.add(r.link);
    box.append(box.childNodes.length?'、':'原文：');
    const el=document.createElement('a');el.href=r.link;el.target='_blank';el.rel='noopener noreferrer';el.textContent=r.source+' ↗';box.append(el);

/* 把一則新聞排成段落；每一句可點選從該句開始朗讀 */

function setRead(i,n){const s=sents[i];if(!s)return;s.r.textContent=s.text.slice(0,n);s.u.textContent=s.text.slice(n)}
function highlight(){
  const seek=$('seek');seek.max=Math.max(1,sents.length-1);seek.value=sentence;
  $('position').textContent=sents.length?`第 ${Math.min(sentence+1,sents.length)} / ${sents.length} 句`:'';eta();
  sents.forEach((s,i)=>{s.el.classList.toggle('active',i===sentence);s.el.classList.toggle('past',i<sentence);if(i!==sentence)setRead(i,0)});

function seekTo(i,play){

/* ---------- 朗讀：同一段的句子合併成一次朗讀，讀起來才連貫 ---------- */
function speakFrom(i){
  if(!synth){status('此瀏覽器不支援語音朗讀，請改用 Safari。',true);return}
  if(!sents.length){status('尚無新聞，請稍候或按右上角重新整理。',true);return}
  if(i>=sents.length){
    if(idx+1<queue.length){idx++;setArticle();i=0}
    else if(loop&&queue.length){idx=0;setArticle();i=0}
    else{mode='ended';sentence=sents.length-1;setPlayIcon(false);keepStop();setSession('none');highlight();return}
  }
  sentence=i;
  let j=i,len=sents[i].text.length;
  while(j+1<sents.length&&sents[j+1].pi===sents[i].pi&&len+sents[j+1].text.length<=MAXU){j++;len+=sents[j].text.length}
  const offs=[];let acc=0;for(let k=i;k<=j;k++){offs.push(acc);acc+=sents[k].text.length}
  const t=token,u=new SpeechSynthesisUtterance(sents.slice(i,j+1).map(s=>s.text).join(''));
  current=u; /* 保留參考，避免被回收導致朗讀中斷 */
  u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=rate;
  mode='starting';setPlayIcon(true);setRead(i,0);highlight();
  /* 依朗讀位置標示目前句子；沒有位置事件的瀏覽器用語速估算 */
  let heard=false,t0=0,est=0;
  const mark=(ci,cl)=>{let k=offs.length-1;while(k>0&&offs[k]>ci)k--;if(i+k!==sentence){sentence=i+k;highlight()}setRead(sentence,ci-offs[k]+(cl||0))};
  u.onstart=()=>{if(t!==token)return;clearTimeout(watchdog);mode='playing';setSession('playing');status('');t0=Date.now();
    est=setInterval(()=>{if(t!==token||heard){clearInterval(est);return}mark(Math.floor((Date.now()-t0)/1000*4.2*rate))},250)};
  u.onboundary=e=>{if(t!==token||e.name==='sentence')return;heard=true;mark(e.charIndex,e.charLength)};
  u.onend=()=>{clearInterval(est);if(t!==token)return;clearTimeout(watchdog);speakFrom(j+1)};
  u.onerror=e=>{
    clearInterval(est);
    if(t!==token||e.error==='canceled'||e.error==='interrupted')return;
    clearTimeout(watchdog);mode='error';setPlayIcon(false);keepStop();
    status(e.error==='not-allowed'?'請再按一次播放。':'朗讀發生問題（'+e.error+'），請再按一次播放。',true);
  };
  watchdog=setTimeout(()=>{if(t===token&&mode==='starting')status('沒有聲音？請確認音量，或改用 Safari 開啟。',true)},5000);
  const go=()=>{if(t!==token)return;try{if(synth.paused)synth.resume();synth.speak(u)}catch(err){status('無法開始朗讀，請再按一次播放。',true)}};
  const wait=180-(Date.now()-lastCancel);wait>0?setTimeout(go,wait):go(); /* 剛取消就朗讀，部分瀏覽器會吃掉 */
}
function togglePlay(){
  if(!synth){status('此瀏覽器不支援語音朗讀，請改用 Safari。',true);return}
  if(isPlaying()){halt();mode='paused';setPlayIcon(false);keepStop();setSession('paused');return}
  if(!queue.length){status('尚無新聞，請稍候或按右上角重新整理。',true);return}
  prime();
  if(mode==='ended'){idx=0;setArticle()}
  speakFrom(sentence);
}
$('play').onclick=togglePlay;$('miniPlay').onclick=togglePlay;
function jump(d){if(!queue.length)return;prime();halt();idx=Math.max(0,Math.min(queue.length-1,idx+d));setArticle();speakFrom(0)}
$('prev').onclick=()=>jump(-1);$('next').onclick=()=>jump(1);$('miniNext').onclick=()=>jump(1);
document.addEventListener('keydown',e=>{

  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);
});

/* ---------- 取得新聞 ----------
   1. 先向自己網站的 /api/news 要整理好的新聞（網站連結 GitHub 部署時，由 Netlify 伺服器整理，最快最穩）
   2. 沒有伺服器（手動上傳版）時，改由手機經公開轉接服務抓取 */
async function fetchRaw(url,ms){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return r}
  finally{clearTimeout(timer)}
}
const fetchJSON=async(u,ms)=>(await fetchRaw(u,ms)).json();
const fetchText=async(u,ms)=>(await fetchRaw(u,ms)).text();
async function loadFromServer(fresh){
  try{const d=await fetchJSON('/api/news'+(fresh?'?fresh='+Date.now():''),fresh?15000:10000);return d&&Array.isArray(d.articles)&&d.articles.length?d:null}catch(e){return null}
}
/* 手機直接抓：同時向 rss2json、allorigins 要資料，先到先用；都失敗再試 codetabs */
async function getItems(url){
  const a=fetchJSON('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url),7000).then(d=>{if(d.status!=='ok'||!d.items||!d.items.length)throw Error('rss2json');return d.items});
  const b=fetchText('https://api.allorigins.win/raw?url='+encodeURIComponent(url),7000).then(t=>{const it=R.parseFeed(t);if(!it.length)throw Error('allorigins');return it});
  try{return await Promise.any([a,b])}catch(e){}
  const it=R.parseFeed(await fetchText('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url),7000));
  if(!it.length)throw Error('沒有資料');return it;
}
async function fetchSource(src){
  const routes=[[src.url,!!src.gn]].concat(src.alt?[[src.alt,true]]:[]);
  let err;
  for(const [u,gn] of routes){try{return{items:await getItems(u),gn}}catch(e){err=e}}
  throw err||Error('沒有資料');
}
/* 手機直接抓時的翻譯：Google 翻譯免費介面；直接連線失敗兩次就改走轉接服務 */
const TR=store.get(TR_KEY,{});
const trLookup=(sl,t)=>TR[R.trKey(sl,t)];
function trSave(){const k=Object.keys(TR);if(k.length>1200)k.slice(0,k.length-900).forEach(x=>delete TR[x]);store.set(TR_KEY,TR)}
const TR_ROUTES=[{wrap:u=>u,fails:0},{wrap:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),fails:0},{wrap:u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),fails:0}];
async function trChunk(sl,list){
  for(const r of TR_ROUTES){
    if(r.fails>=2)continue;
    try{
      const out=R.gtxLines(await fetchJSON(r.wrap(R.gtxURL(sl,list)),8000),list.length);
      r.fails=0;
      if(out)return out;
      if(list.length===1)return null;
      const h=Math.ceil(list.length/2),a=await trChunk(sl,list.slice(0,h)),b=a&&await trChunk(sl,list.slice(h));
      return a&&b?a.concat(b):null;
    }catch(e){r.fails++}
  }
  return null;
}
const trPending=new Set();let trQueue=[],trBusy=0,trDone=0,trTotal=0,trWaiters=[];
function enqueueTranslation(items){
  const chunks=R.chunkJobs(R.translationJobs(items),(sl,t)=>!!trLookup(sl,t)||trPending.has(R.trKey(sl,t)),1200);
  chunks.forEach(([sl,list])=>{list.forEach(t=>trPending.add(R.trKey(sl,t)));trTotal+=list.length});
  trQueue.push(...chunks);pumpTranslation();
}
function pumpTranslation(){
  while(trBusy<2&&trQueue.length){
    const [sl,list]=trQueue.shift();trBusy++;
    trChunk(sl,list).then(out=>{if(out)list.forEach((t,i)=>{TR[R.trKey(sl,t)]=out[i]})}).catch(()=>{})
      .finally(()=>{list.forEach(t=>trPending.delete(R.trKey(sl,t)));trDone+=list.length;trBusy--;firstBatch();progress();pumpTranslation();
        if(!trBusy&&!trQueue.length){const w=trWaiters;trWaiters=[];w.forEach(f=>f())}});
  }
}
const translationDone=()=>new Promise(res=>{if(!trBusy&&!trQueue.length)res();else trWaiters.push(res)});

/* 載入中只先顯示第一批，其餘等全部整理完再一次更新，畫面不會跳來跳去 */
let clientRaw=[],shownThisLoad=false,firstTimer=0,srcDone=0;
function firstBatch(){if(shownThisLoad)return;clearTimeout(firstTimer);firstTimer=setTimeout(()=>{if(!shownThisLoad)applyArticles(R.finalize(clientRaw,trLookup).list,false)},300)}
function applyArticles(list,final){
  if(!list.length||(!final&&shownThisLoad))return;
  shownThisLoad=true;articles=list;loadedOnce=true;
  syncQueue();renderShelves();
}
/* 更新播放清單，但不打斷、不更換正在顯示的這則 */
function syncQueue(){
  if(!queue.length){queue=digest();idx=0;autoQueue=true;queueKey='';setArticle();return}
  if(!autoQueue||isPlaying()||mode==='paused')return;
  const cur=queue[idx],d=digest(),k=cur?d.findIndex(x=>x.link===cur.link):-1;
  if(k>=0){queue=d;idx=k;const n=d[k];if(n.title!==cur.title||n.summary!==cur.summary||n.intro!==cur.intro)setArticle();else paintMeta()}
  else if(d.length){queue=d;idx=0;setArticle()}
}
function progress(){if(loading)$('newsStatus').textContent=`更新中 ${srcDone}/${R.SOURCES.length}`+(trTotal?` · 翻譯 ${trDone}/${trTotal}`:'')}
async function loadClient(){
  clientRaw=[];srcDone=0;trDone=trTotal=0;
  const seen=new Set();
  await Promise.all(R.SOURCES.map(async src=>{
    try{
      const r=await fetchSource(src);
      const l=R.normalize(src,r.items,r.gn).filter(x=>!seen.has(x.link)&&seen.add(x.link));
      clientRaw.push(...l);enqueueTranslation(l);firstBatch(); /* 中文來源不必翻譯，會最先出現 */
    }catch(e){}
    srcDone++;progress();
  }));
  await translationDone();trSave();clearTimeout(firstTimer);
  return R.finalize(clientRaw,trLookup).list;
}
async function load(fresh){
  if(loading)return;loading=true;
  const btn=$('refresh');btn.classList.add('spin');btn.disabled=true;
  shownThisLoad=articles.length>0;
  $('newsStatus').textContent='更新中…';
  try{
    const d=await loadFromServer(fresh);
    const list=d?d.articles:await loadClient();
    lastUpdated=d&&d.updated||Date.now();
    if(list.length){
      applyArticles(list,true);store.set(CACHE_KEY,{saved:lastUpdated,articles:list});
      $('newsStatus').textContent=`更新於 ${hm(lastUpdated)}`;
    }else{
      loadedOnce=true;renderShelves();
      $('newsStatus').textContent=articles.length?'更新失敗，顯示先前的新聞':'暫時無法取得新聞';
    }
  }finally{
    loading=false;btn.classList.remove('spin');btn.disabled=false;
  }
}
$('refresh').onclick=()=>load(true);
/* 用 iPhone 的 Siri 聲音：把今日四大板塊重點帶到新聞稿頁，用 Safari「聆聽頁面」或「朗讀螢幕」朗讀 */
$('siri').onclick=()=>{

  if(!list.length){status('尚無新聞，請稍候或按右上角重新整理。',true);return}
  store.set('news-listen',{saved:lastUpdated,at:Date.now(),list:list.slice(0,20)});
  location.href='/listen.html';
};

/* ---------- Service Worker（加到主畫面後可離線開啟播放器） ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:')
  addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));

/* ---------- 啟動：先顯示上次的新聞，再到背景更新 ---------- */
const cache=store.get(CACHE_KEY,null);
if(cache&&Array.isArray(cache.articles)&&cache.articles.length){
  articles=cache.articles.filter(a=>CATS.includes(a.category));lastUpdated=cache.saved||0;loadedOnce=true;
  queue=digest();if(queue.length)setArticle();
}
renderShelves();load();
setInterval(()=>{if(document.visibilityState==='visible')load()},600000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!loading&&Date.now()-lastUpdated>600000)load()}); /* 回到畫面時若超過 10 分鐘就更新 */
</script>
</body>
</html>
