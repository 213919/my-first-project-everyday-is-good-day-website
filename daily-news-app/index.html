<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/icons/icon-dark-192.png" media="(prefers-color-scheme: dark)">
<script>/* 加到主畫面時，依手機目前的淺色／深色模式選用對應圖示 */
(function(){try{var q=matchMedia('(prefers-color-scheme: dark)'),a=document.querySelector('link[rel=apple-touch-icon]'),f=function(){a.href=q.matches?'/icons/icon-dark-180.png':'/icons/icon-180.png'};f();q.addEventListener&&q.addEventListener('change',f)}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="聲讀">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>聲讀｜每日全球重點</title>
<style>
:root{color-scheme:dark;--c1:#22305a;--c2:#1ed760;--l:#3b4f8f;--bg:#121212;--fg:#fff;--mute:#b3b3b3;--green:#1ed760}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{position:relative;margin:0;color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
svg{display:block;fill:currentColor}

/* 背景：依目前板塊變色，往下漸層融入深色（像 Spotify 的專輯色） */
.backdrop{position:absolute;top:0;left:0;right:0;height:min(1150px,150vh);z-index:-1;background-color:var(--c1);transition:background-color .8s ease;overflow:hidden;pointer-events:none}
.backdrop::before{content:'';position:absolute;width:130vw;height:130vw;max-width:980px;max-height:980px;right:-45vw;top:-55vw;border-radius:50%;background:radial-gradient(circle,var(--c2) 0%,transparent 66%);opacity:.6}
.backdrop::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,18,.12) 0%,rgba(18,18,18,.72) 34%,#121212 64%)}
.shell{max-width:480px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}

/* ---------- 正在播放 ---------- */
.np-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:2px 0 14px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ibtn svg{width:26px;height:26px}
.chev{transition:transform .25s}
.compact-on .chev{transform:rotate(180deg)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.np-title{text-align:center;line-height:1.3}
.np-title small{display:block;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.72)}
.np-title b{font-size:14.5px;font-weight:700}

/* 逐字稿：像 Spotify 的歌詞卡片 */
.lyrics{position:relative;border-radius:16px;background-color:var(--l);transition:background-color .8s ease;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden;isolation:isolate}
.lyrics::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.25))}
.lyr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;font-size:14px;font-weight:800}
.lyr-head b{display:flex;align-items:center;gap:8px}
.lyr-head span{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72)}
.eq{display:none;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;height:100%;background:#fff;border-radius:1px;animation:eqb .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
.is-playing .eq{display:flex}
@keyframes eqb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.script{position:relative;height:300px;height:clamp(210px,calc(100dvh - 440px),400px);overflow:auto;overscroll-behavior:contain;padding:10px 18px 26px;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 26px),transparent)}
.compact-on .script{height:132px}
.para{margin:0 0 14px;font-size:22px;line-height:1.45;font-weight:800;color:rgba(0,0,0,.6)}
.plabel{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;color:rgba(255,255,255,.75);margin-bottom:2px}
.s{cursor:pointer;transition:color .25s}
.s.past{color:rgba(255,255,255,.7)}
.s.active{color:rgba(255,255,255,.78)}
.s.active .r{color:#fff}
.para.intro{font-size:15px;color:rgba(255,255,255,.8)}
.para.notice{font-size:15px;line-height:1.5;color:rgba(255,255,255,.88);background:rgba(0,0,0,.2);border-radius:10px;padding:8px 12px}
.para.source{font-size:15px;line-height:1.5}

.info{margin-top:22px}
.info h1{font-size:21px;line-height:1.35;font-weight:800;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info p{margin:4px 0 0;color:var(--mute);font-size:14.5px}
.srcs{font-size:13px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.srcs::-webkit-scrollbar{display:none}
.srcs a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
.prog{margin-top:16px}
input[type=range]{--p:0%;-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.28) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.28) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:4px}
.side{position:relative;justify-self:center;width:48px;height:48px;display:grid;place-items:center;color:var(--mute);font-size:14px;font-weight:800}
.side svg{width:24px;height:24px}
#loop[aria-pressed=true]{color:var(--green)}
#loop[aria-pressed=true]::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}
.mid{display:flex;align-items:center;gap:22px}
.skip{width:48px;height:48px;display:grid;place-items:center}
.skip svg{width:34px;height:34px}
#play{width:66px;height:66px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .1s}
#play:active{transform:scale(.95)}
#play svg{width:30px;height:30px}
.status{font-size:12.5px;line-height:1.6;margin:6px 0 0;text-align:center;color:#ffd88a}
.status:empty{display:none}

/* ---------- 今日重點：四大板塊 ---------- */
.home{margin-top:34px}
.home-head{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;justify-content:space-between;margin:0 -16px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;
  background:rgba(18,18,18,.55);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.home-head h2{margin:0;font-size:24px;font-weight:800}
.home-head small{color:var(--mute);font-size:12.5px}
.shelf{margin-top:20px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.shelf-head h3{margin:0;font-size:21px;font-weight:800}
.shelf-head button{color:var(--mute);font-size:13px;font-weight:800;padding:6px 0 6px 10px}
.track{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:0 16px 8px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 152px;scroll-snap-align:start;text-align:left}
.cover{position:relative;display:block;width:152px;height:152px;border-radius:8px;overflow:hidden;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 10px 26px rgba(0,0,0,.5)}
.cover::before{content:'';position:absolute;width:125%;height:125%;right:-60%;top:-60%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 62%)}
.cover::after{content:'';position:absolute;left:0;right:0;bottom:0;height:62%;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kick{position:absolute;z-index:2;left:10px;top:9px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.92)}
.csrc{position:absolute;z-index:2;left:10px;right:10px;bottom:9px;font-size:19px;font-weight:900;line-height:1.1;color:#fff}
.pl{position:absolute;z-index:3;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#000;display:none;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.pl svg{width:20px;height:20px}
.card.playing .pl{display:grid}
.ctitle{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.4;font-weight:700;margin-top:8px}
.card.playing .ctitle{color:var(--green)}
.cmeta{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.k-全球政治{--a:#e13300;--b:#7d1838}
.k-全球經濟{--a:#e8a10c;--b:#9a3b00}
.k-全球科技{--a:#4f9bf5;--b:#2b2ab8}
.k-對台灣的影響{--a:#1ed760;--b:#0a5f5a}
.skel .cover{background:linear-gradient(90deg,#222 25%,#2e2e2e 50%,#222 75%);background-size:200% 100%;animation:sh 1.2s infinite linear;box-shadow:none}
.skel .cover::before,.skel .cover::after{display:none}
.sk{display:block;height:11px;border-radius:6px;margin-top:10px;background:#2a2a2a}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{color:var(--mute);text-align:center;padding:30px 0;font-size:14px}
.empty-row{color:var(--mute);font-size:13.5px;margin:0 0 6px}

/* ---------- 迷你播放列（半透明毛玻璃） ---------- */
.mini{position:fixed;z-index:20;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:464px;margin:0 auto;height:62px;display:flex;align-items:center;gap:10px;padding:0 4px 0 8px;border-radius:12px;overflow:hidden;isolation:isolate;
  background:rgba(36,36,36,.55);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 32px rgba(0,0,0,.5);
  transform:translateY(150%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}
.mini::before{content:'';position:absolute;inset:0;z-index:-1;background-color:var(--c1);transition:background-color .8s ease;opacity:.5}
.mini.show{transform:none;visibility:visible;transition:transform .28s ease}
.mcov{width:44px;height:44px;border-radius:6px;flex:none;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 4px 10px rgba(0,0,0,.35)}
.mini-main{flex:1;min-width:0;text-align:left;line-height:1.3}
.mini-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-main small{font-size:12.5px;color:rgba(255,255,255,.75)}
.mp,.mn{width:44px;height:44px;display:grid;place-items:center;flex:none}
.mp svg{width:30px;height:30px}.mn svg{width:26px;height:26px}
.mbar{position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:1px;background:rgba(255,255,255,.25)}
.mbar i{display:block;height:100%;width:0;border-radius:1px;background:#fff;transition:width .3s}
/* 重點摘要 */
.points{margin:0 0 14px;padding:12px 14px 4px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}
.points h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
.points button{display:block;width:100%;text-align:left;padding:7px 0 9px;border-top:1px solid rgba(255,255,255,.07)}
.points button:first-of-type{border-top:0}
.points b{display:block;font-size:14.5px;line-height:1.4;font-weight:700}
.points span{display:block;margin-top:2px;font-size:13px;line-height:1.5;color:var(--mute)}
.points button.cur b{color:var(--green)}
/* 世界地圖 */
.worldmap{margin-top:36px}
.mapbox{margin:12px -4px 0;padding:6px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
#mapSvg{display:block;width:100%;height:auto}
#mapSvg path{fill:#2b2b2b;stroke:#121212;stroke-width:.5;transition:fill .4s}
#mapSvg path.lit{stroke:rgba(255,255,255,.55);stroke-width:.7;cursor:pointer;animation:glow 2.4s ease-in-out infinite alternate}
#mapSvg path.sel{stroke:#fff;stroke-width:1.6}
#mapSvg path.now{stroke:#fff;stroke-width:1.8;animation:none}
@keyframes glow{from{opacity:.78}to{opacity:1}}
.mapnote{margin:10px 2px 0;font-size:12.5px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08);font-size:13.5px;font-weight:700}
.chip i{width:8px;height:8px;border-radius:50%}
.chip small{color:var(--mute);font-weight:700;font-size:12px}
.chip.on{background:#fff;color:#000}.chip.on small{color:#444}
.mapnews{margin-top:12px}
.mapnews h4{margin:0 0 4px;font-size:15px}
.mapnews button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px;line-height:1.45;font-weight:600}
.mapnews button i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="shell">
<section class="np" id="player" aria-label="正在播放">
  <header class="np-head">
    <button class="ibtn" id="collapse" aria-label="收合／展開逐字稿" aria-expanded="true"><svg class="chev" viewBox="0 0 24 24"><path d="M3.5 8.5 12 17l8.5-8.5-1.4-1.4L12 14.2 4.9 7.1z"/></svg></button>
    <div class="np-title"><small>正在播放</small><b id="npCat">今日重點</b></div>
    <button class="ibtn" id="refresh" aria-label="重新整理新聞"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
  </header>

  <div class="lyrics">
    <div class="lyr-head"><b>逐字稿<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></b><span id="npPos"></span></div>
    <div class="script" id="script"><p class="para"><span class="s">新聞載入中…</span></p></div>
  </div>

  <div class="info">
    <h1 id="title">今日全球重點</h1>
    <p id="meta">等待新聞載入</p>
    <div class="srcs" id="srcs"></div>
  </div>

  <div class="prog">
    <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="朗讀進度">
    <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
  </div>

  <div class="ctl" id="ctl">
    <button class="side" id="rateBtn" aria-label="切換語速">1.0x</button>
    <div class="mid">
      <button class="skip" id="prev" aria-label="上一則"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button id="play" aria-label="播放"></button>
      <button class="skip" id="next" aria-label="下一則"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <button class="side" id="loop" aria-label="循環播放" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
  <p id="audio" class="status" role="status"></p>
</section>

<section class="home" id="news" aria-labelledby="newsHead">
  <div class="home-head"><h2 id="newsHead">今日重點</h2><small id="newsStatus">載入中…</small></div>
  <div id="shelves"></div>
</section>

<section class="worldmap" id="worldmap" aria-labelledby="mapHead">
  <div class="home-head"><h2 id="mapHead">世界地圖</h2><small id="mapCount"></small></div>
  <div class="mapbox"><svg id="mapSvg" role="img" aria-label="世界地圖，亮起的國家表示今日新聞提到該地區"></svg></div>
  <div class="legend" id="legend"></div>
  <p class="mapnote">亮起的地區＝今日新聞提到的地方，點選可看相關新聞。</p>
  <div class="chips" id="mapChips"></div>
  <div class="mapnews" id="mapNews"></div>
</section>
</div>

<div class="mini" id="mini" role="region" aria-label="正在播放">
  <span class="mcov" id="miniCov" aria-hidden="true"></span>
  <button class="mini-main" id="miniMain" aria-label="回到播放器"><b id="miniTitle"></b><small id="miniMeta"></small></button>
  <button class="mp" id="miniPlay" aria-label="播放"></button>
  <button class="mn" id="miniNext" aria-label="下一則"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  <span class="mbar" aria-hidden="true"><i id="miniBar"></i></span>
</div>

<script src="/rules.js"></script>
<script src="/map.js"></script>
<script>
'use strict';
const R=window.NewsRules;
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
const CATS=R.CATS,PER=R.PER_CAT;
const SECTION_NAME={'全球政治':'全球政治重點','全球經濟':'全球經濟重點','全球科技':'全球科技重點','對台灣的影響':'對台灣影響的相關新聞'};
/* 各板塊的主題色：背景主色、背景光暈、逐字稿卡片（較亮，未唸到的深色字才看得清楚） */
const THEME={'全球政治':['#a3243b','#ff7a45','#d63a4b'],'全球經濟':['#8f5a00','#ffc93c','#c27c00'],'全球科技':['#2a3aa8','#4fc3f7','#4766e8'],'對台灣的影響':['#0f6e57','#1ed760','#15936b']};
const RATES=[0.8,1,1.2,1.4],CACHE_KEY='news-v6',TR_KEY='news-tr-v1',CPS=4.2;
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MAXU=IOS?220:100; /* 同一段的句子合併成一次朗讀（最多幾個字），減少句子之間的停頓 */
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

/* ---------- iPhone 靜音模式：宣告本頁為媒體播放（iOS 16.4+） ----------
   先前搭配的「背景無聲音軌」會和朗讀搶 iPhone 的音訊，造成播一秒就停、斷斷續續，已移除。 */

/* ---------- 語音：固定使用系統國語（台灣）語音，有高品質版本時優先 ---------- */
const inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger|MQQBrowser|; wv\)/i.test(navigator.userAgent);
function pickVoice(){
  if(!synth)return;
  const zh=synth.getVoices().filter(v=>/^zh|^cmn/i.test(v.lang));
  const tw=zh.filter(v=>/TW|Hant/i.test(v.lang)),pool=tw.length?tw:zh.filter(v=>!/HK|yue/i.test(v.lang));
  voice=pool.find(v=>/premium|enhanced|增強|優化|高品質/i.test(v.name+' '+(v.voiceURI||'')))||pool.find(v=>v.localService)||pool[0]||null;
}
if(synth){
  pickVoice();synth.addEventListener('voiceschanged',pickVoice);
  let tries=0;const poll=setInterval(()=>{if(voice||++tries>10)clearInterval(poll);else pickVoice()},500); /* 語音清單常延遲才出現 */
}else status('此瀏覽器不支援語音朗讀，請改用 Safari。',true);

function halt(){token++;clearTimeout(watchdog);if(synth){synth.cancel();lastCancel=Date.now()}}
const ABBR=[[/TechNews/gi,'科技新報'],[/\bAI\b/g,'人工智慧'],[/\bGDP\b/g,'國內生產毛額'],[/\bETF\b/g,'指數股票型基金'],
 [/\bFed\b/g,'聯準會'],[/\bIMF\b/g,'國際貨幣基金'],[/\bWTO\b/g,'世界貿易組織'],[/\bOPEC\+?/g,'石油輸出國組織'],
 [/\bNATO\b/g,'北約'],[/\bEU\b/g,'歐盟'],[/\bUN\b/g,'聯合國'],[/\bUSA?\b/g,'美國'],[/\bG7\b/g,'七大工業國集團'],
 [/\bG20\b/g,'二十國集團'],[/\bCPI\b/g,'消費者物價指數'],[/\bECB\b/g,'歐洲央行'],[/\bIPO\b/g,'首次公開募股'],
 [/\bEV\b/g,'電動車'],[/\bNVIDIA\b/gi,'輝達'],[/\bTSMC\b/g,'台積電'],[/\bWHO\b/g,'世界衛生組織']];

  if(!t)return'';const m=Math.round((Date.now()-t)/6e4);
  if(m<1)return'剛剛';if(m<60)return m+' 分鐘前';if(m<1440)return Math.round(m/60)+' 小時前';return Math.round(m/1440)+' 天前';
}
/* 進度條與時間（依字數與語速估算） */
function progressAt(extra){
  const total=sents.reduce((n,s)=>n+s.text.length,0);if(!total){$('tCur').textContent='0:00';$('tLeft').textContent='-0:00';return}
  const done=Math.min(total,sents.slice(0,sentence).reduce((n,s)=>n+s.text.length,0)+(extra||0)),pct=done/total*100;
  $('seek').style.setProperty('--p',pct.toFixed(1)+'%');$('miniBar').style.width=pct.toFixed(1)+'%';
  $('tCur').textContent=mmss(done/(CPS*rate));$('tLeft').textContent='-'+mmss((total-done)/(CPS*rate));
}
function paintMeta(){
  const a=queue[idx];if(!a)return;
  $('meta').textContent=a.source+(a.time?' · '+ago(a.time):'');
  $('npCat').textContent=a.category;$('npPos').textContent=`${idx+1} / ${queue.length}`;paintMini();
}
/* 原文連結：主要來源＋相關報導 */
function paintSources(a){
  const box=$('srcs');box.replaceChildren();const seen=new Set();
  [{source:a.source,link:a.link}].concat(a.related||[]).forEach(r=>{
    if(!r.link||seen.has(r.link)||!/^https?:\/\//i.test(r.link))return;seen.add(r.link);
    box.append(box.childNodes.length?'　':'原文　');
    const el=document.createElement('a');el.href=r.link;el.target='_blank';el.rel='noopener noreferrer';el.textContent=r.source;box.append(el);
  });

/* 把一則新聞排成段落；每一句可點選從該句開始朗讀 */
function setArticle(){
  const a=queue[idx];if(!a)return;sentence=0;
  const box=$('script');box.replaceChildren();sents=[];
  R.buildScript(a).paras.forEach((p,pi)=>{
    const el=document.createElement('p');el.className='para '+p.kind;
    if(p.label){const l=document.createElement('small');l.className='plabel';l.textContent=p.label;el.append(l)}
    p.sents.forEach(t=>{
      const text=spoken(t);if(!text)return;
      const s=document.createElement('span'),r=document.createElement('span'),u=document.createElement('span');
      s.className='s';r.className='r';u.textContent=text;s.append(r,u);
      const i=sents.length;s.onclick=()=>seekTo(i,true);

function setRead(i,n){const s=sents[i];if(!s)return;s.r.textContent=s.text.slice(0,n);s.u.textContent=s.text.slice(n)}
function highlight(){
  const seek=$('seek');seek.max=Math.max(1,sents.length-1);seek.value=sentence;progressAt(0);
  sents.forEach((s,i)=>{s.el.classList.toggle('active',i===sentence);s.el.classList.toggle('past',i<sentence);if(i!==sentence)setRead(i,0)});
  const sc=$('script'),n=sents[sentence]&&sents[sentence].el;
  if(n)sc.scrollTo({top:Math.max(0,n.offsetTop-sc.clientHeight/3),behavior:smooth()});
}
function seekTo(i,play){

}
$('seek').oninput=()=>{const v=Number($('seek').value);$('seek').style.setProperty('--p',(v/Math.max(1,sents.length-1)*100).toFixed(1)+'%')};
$('seek').onchange=()=>seekTo(Number($('seek').value),false);

/* ---------- 朗讀：同一段的句子合併成一次朗讀，讀起來才連貫 ---------- */
function speakFrom(i){
  if(!synth){status('此瀏覽器不支援語音朗讀，請改用 Safari。',true);return}
  if(!sents.length){status('尚無新聞，請稍候或按右上角重新整理。',true);return}
  if(i>=sents.length){
    if(idx+1<queue.length){idx++;setArticle();i=0}
    else if(loop&&queue.length){idx=0;setArticle();i=0}
    else{mode='ended';sentence=sents.length-1;setPlayIcon(false);highlight();progressAt(sents[sentence]?sents[sentence].text.length:0);return}
  }
  sentence=i;
  let j=i,len=sents[i].text.length;
  while(j+1<sents.length&&sents[j+1].pi===sents[i].pi&&len+sents[j+1].text.length<=MAXU){j++;len+=sents[j].text.length}
  const offs=[];let acc=0;for(let k=i;k<=j;k++){offs.push(acc);acc+=sents[k].text.length}
  const t=token,u=new SpeechSynthesisUtterance(sents.slice(i,j+1).map(s=>s.text).join(''));
  current=u; /* 保留參考，避免被回收導致朗讀中斷 */
  u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=rate;
  mode='starting';lastEvt=Date.now();uStart=0;setPlayIcon(true);setRead(i,0);highlight();
  /* 依朗讀位置標示目前句子；沒有位置事件的瀏覽器用語速估算 */
  let heard=false,t0=0,est=0;
  const mark=(ci,cl)=>{let k=offs.length-1;while(k>0&&offs[k]>ci)k--;if(i+k!==sentence){sentence=i+k;highlight()}const n=ci-offs[k]+(cl||0);setRead(sentence,n);progressAt(n)};
  u.onstart=()=>{if(t!==token)return;clearTimeout(watchdog);mode='playing';status('');t0=Date.now();lastEvt=t0;uStart=t0;uLen=len;stallTries=0;
    est=setInterval(()=>{if(t!==token||heard){clearInterval(est);return}mark(Math.floor((Date.now()-t0)/1000*CPS*rate))},250)};
  u.onboundary=e=>{if(t!==token||e.name==='sentence')return;heard=true;lastEvt=Date.now();mark(e.charIndex,e.charLength)};
  u.onend=()=>{clearInterval(est);if(t!==token)return;clearTimeout(watchdog);lastEvt=Date.now();uStart=0;stallTries=0;speakFrom(j+1)};
  u.onerror=e=>{
    clearInterval(est);
    if(t!==token||e.error==='canceled'||e.error==='interrupted')return;
    clearTimeout(watchdog);mode='error';setPlayIcon(false);
    status(e.error==='not-allowed'?'請再按一次播放。':'朗讀發生問題（'+e.error+'），請再按一次播放。',true);
  };
  watchdog=setTimeout(()=>{if(t===token&&mode==='starting')status('沒有聲音？請確認音量，或改用 Safari 開啟。',true)},5000);
  const go=()=>{if(t!==token)return;lastEvt=Date.now();uStart=0;try{if(synth.paused)synth.resume();synth.speak(u)}catch(err){status('無法開始朗讀，請再按一次播放。',true)}};
  const wait=250-(Date.now()-lastCancel);wait>0?setTimeout(go,wait):go(); /* 剛取消就朗讀，iPhone 常會吃掉，稍等一下 */
}
function togglePlay(){
  if(!synth){status('此瀏覽器不支援語音朗讀，請改用 Safari。',true);return}
  if(isPlaying()){halt();mode='paused';setPlayIcon(false);return}
  if(!queue.length){status('尚無新聞，請稍候或按右上角重新整理。',true);return}
  prime();
  if(mode==='ended'){idx=0;setArticle()}
  speakFrom(sentence);
}
$('play').onclick=togglePlay;$('miniPlay').onclick=togglePlay;
function jump(d){if(!queue.length)return;prime();halt();idx=Math.max(0,Math.min(queue.length-1,idx+d));setArticle();speakFrom(0)}
$('prev').onclick=()=>jump(-1);$('next').onclick=()=>jump(1);$('miniNext').onclick=()=>jump(1);
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);
});

/* ---------- 朗讀時螢幕保持亮著（像看 YouTube，不會 30 秒就自動關螢幕） ----------
   使用 Screen Wake Lock（iOS 16.4+）。播放中取得，暫停或播完就釋放；切回畫面時自動重新取得。 */
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&document.visibilityState==='visible'&&(!wakeLock||wakeLock.released)){
      wakeLock=await navigator.wakeLock.request('screen');
    }else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release()}
  }catch(e){wakeLock=null}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isPlaying())keepAwake(true)});

/* ---------- 朗讀守護 ----------
   iPhone 的語音常被系統打斷（切換畫面、通知、其他聲音），會停在暫停或卡住不動。
   每秒檢查一次：暫停就繼續；太久沒有動靜就從目前這句重新唸（最多重試 3 次）。 */
let lastEvt=0,uStart=0,uLen=0,stallTries=0;
setInterval(()=>{
  if(!synth||!isPlaying())return;
  if(synth.paused){try{synth.resume()}catch(e){}lastEvt=Date.now();return}
  const now=Date.now(),idle=now-lastEvt;
  const stuck=(mode==='starting'&&idle>3500)||(mode==='playing'&&idle>4000&&!synth.speaking&&!synth.pending)||(uStart&&now-uStart>uLen/(CPS*rate)*1600+5000);
  if(!stuck)return;
  if(stallTries++<3){halt();mode='idle';speakFrom(sentence)}
  else{stallTries=0;halt();mode='paused';setPlayIcon(false);status('朗讀被中斷了，請再按一次播放。',true)}
},1000);

/* ---------- 播放清單：四大板塊依序，各 5 則；每個板塊開頭唸一句開場白 ---------- */
const intro=(c,first)=>(first?'以下是':'接下來是')+SECTION_NAME[c]+'。';
function digest(){
  const out=[];
  CATS.forEach(c=>articles.filter(a=>a.category===c).slice(0,PER).forEach((a,i)=>out.push(i?a:Object.assign({},a,{intro:intro(c,!out.length)}))));
  return out;
}
function scrollToPlayer(){window.scrollTo({top:0,behavior:smooth()})}
function playFrom(list,i,key){
  if(!list.length)return;
  prime();halt();queue=list.map((a,k)=>k===i&&key?Object.assign({},a,{intro:intro(key,true)}):a);idx=i;autoQueue=false;queueKey=key||'';
  setArticle();speakFrom(0);scrollToPlayer();
}
function cardTap(list,i,key){
  const a=list[i],cur=queue[idx];
  if(cur&&a&&cur.link===a.link&&mode!=='ended'){if(!isPlaying()){prime();speakFrom(sentence)}scrollToPlayer();return} /* 點正在播的那張：繼續播放 */
  playFrom(list,i,key);
}
function makeCard(a,onTap){

  if(a.img){const im=document.createElement('img');im.alt='';im.loading='lazy';im.decoding='async';im.referrerPolicy='no-referrer';im.onerror=()=>im.remove();im.src=a.img;cov.append(im)}

  const src=document.createElement('span');src.className='csrc';src.textContent=a.source;
  const pl=document.createElement('span');pl.className='pl';pl.innerHTML=ICON_PLAY;
  cov.append(kick,src,pl);

  const meta=document.createElement('span');meta.className='cmeta';meta.textContent=a.time?ago(a.time):a.source;

function skeleton(){
  const frag=document.createDocumentFragment();
  CATS.slice(0,2).forEach(c=>{
    const sec=document.createElement('section'),head=document.createElement('div'),h=document.createElement('h3'),track=document.createElement('div');
    sec.className='shelf';head.className='shelf-head';h.textContent=c;head.append(h);track.className='track';
    for(let i=0;i<3;i++){const k=document.createElement('div');k.className='card skel';k.innerHTML='<span class="cover"></span><span class="sk" style="width:90%"></span><span class="sk" style="width:60%"></span>';track.append(k)}
    sec.append(head,track);frag.append(sec);
  });
  return frag;
}
/* ---------- 重點摘要：每個板塊的重點（標題＋內文第一句） ---------- */
function firstSentence(a){
  const t=R.splitSentences(a.summary||'')[0]||'';
  if(!t||t===a.title)return'';
  if(t.length<=52)return t;
  const cut=t.slice(0,52),k=Math.max(cut.lastIndexOf('，'),cut.lastIndexOf('、'));
  return (k>20?cut.slice(0,k):cut)+'…';
}
function pointsBox(list,c){
  const box=document.createElement('div');box.className='points';
  const h=document.createElement('h4');h.textContent='重點摘要';box.append(h);
  list.forEach((a,i)=>{
    const b=document.createElement('button'),t=document.createElement('b');b.dataset.link=a.link;t.textContent=a.title;b.append(t);
    const f=firstSentence(a);if(f){const sp=document.createElement('span');sp.textContent=f;b.append(sp)}
    b.onclick=()=>cardTap(list,i,c);box.append(b);
  });
  return box;
}
function renderShelves(){
  renderMap();
  const box=$('shelves'),pos={};
  box.querySelectorAll('.track[data-key]').forEach(t=>{pos[t.dataset.key]=t.scrollLeft}); /* 重畫時保留各列滑動位置 */
  box.replaceChildren();
  if(!articles.length){
    if(loadedOnce){const p=document.createElement('p');p.className='empty';p.textContent='暫時無法取得新聞，請稍後按右上角重新整理。';box.append(p)}
    else box.append(skeleton());
    return;
  }
  CATS.forEach(c=>{
    const list=articles.filter(a=>a.category===c).slice(0,PER);
    const sec=document.createElement('section'),head=document.createElement('div'),h=document.createElement('h3'),all=document.createElement('button'),track=document.createElement('div');
    sec.className='shelf';sec.setAttribute('aria-label',c);head.className='shelf-head';h.textContent=c;
    all.textContent='全部播放';all.onclick=()=>playFrom(list,0,c);
    head.append(h,all);
    if(list.length)sec.append(head,pointsBox(list,c));
    if(!list.length){const e=document.createElement('p');e.className='empty-row';e.textContent='目前沒有足夠內容的新聞，稍後會自動更新。';all.hidden=true;sec.className='shelf';head.className='shelf-head';h.textContent=c;sec.append(head,e);box.append(sec);return}
    track.className='track';track.dataset.key=c;track.setAttribute('role','list');track.setAttribute('aria-label',c+'（左右滑動）');
    list.forEach((a,i)=>track.append(makeCard(a,()=>cardTap(list,i,c))));
    if(!sec.contains(head))sec.append(head);sec.append(track);box.append(sec);
    if(pos[c])track.scrollLeft=pos[c];
  });
  markPlaying(false);
}
function markPlaying(follow=true){
  const cur=queue[idx]?queue[idx].link:'';
  document.querySelectorAll('#shelves .card[data-link]').forEach(c=>c.classList.toggle('playing',!!cur&&c.dataset.link===cur));
  document.querySelectorAll('#shelves .points button').forEach(c=>c.classList.toggle('cur',!!cur&&c.dataset.link===cur));
  markMapNow();
  if(!follow||!cur)return;
  const key=queueKey||(queue[idx]&&queue[idx].category);
  const t=[...document.querySelectorAll('#shelves .track')].find(x=>x.dataset.key===key); /* 自動播下一則時，讓該張卡片滑進畫面 */
  const c=t&&[...t.children].find(x=>x.dataset.link===cur);
  if(c)t.scrollTo({left:Math.max(0,c.offsetLeft-16),behavior:smooth()});
}

const WM=window.WorldMap,CAT_COLOR={'全球政治':'#ff7a45','全球經濟':'#ffc93c','全球科技':'#4fc3f7','對台灣的影響':'#1ed760'};
let mapPaths=null,mapSel=null,regionIndex={},chipsAll=false;
function buildMap(){
  const svg=$('mapSvg');if(!WM||mapPaths)return;
  svg.setAttribute('viewBox','0 0 '+WM.MAP.w+' '+WM.MAP.h);mapPaths={};
  for(const id in WM.MAP.c){
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',WM.MAP.c[id].d);p.dataset.id=id;p.onclick=()=>{if(regionIndex[id])selectRegion(id)};
    svg.append(p);mapPaths[id]=p;
  }
  $('legend').innerHTML=CATS.map(c=>`<span><i style="background:${CAT_COLOR[c]}"></i>${c}</span>`).join('');
}
function renderMap(){
  if(!WM)return;buildMap();
  regionIndex={};
  CATS.forEach(c=>articles.filter(a=>a.category===c).slice(0,PER).forEach(a=>{
    WM.detect(a.title+' '+(a.summary||'')).forEach(id=>{const r=regionIndex[id]=regionIndex[id]||{cat:c,list:[]};if(!r.list.includes(a))r.list.push(a)});
  }));
  for(const id in mapPaths){const p=mapPaths[id],r=regionIndex[id];p.classList.toggle('lit',!!r);p.style.fill=r?CAT_COLOR[r.cat]:'';}
  const ids=Object.keys(regionIndex).sort((a,b)=>regionIndex[b].list.length-regionIndex[a].list.length);
  $('mapCount').textContent=ids.length?ids.length+' 個地區有新聞':'';
  const chips=$('mapChips');chips.replaceChildren();
  const LIM=14,shown=chipsAll||(mapSel&&ids.indexOf(mapSel)>=LIM)?ids:ids.slice(0,LIM);
  shown.forEach(id=>{const b=document.createElement('button'),r=regionIndex[id];b.className='chip'+(mapSel===id?' on':'');b.dataset.id=id;
    b.innerHTML=`<i style="background:${CAT_COLOR[r.cat]}"></i>${WM.name(id)} <small>${r.list.length}</small>`;b.onclick=()=>selectRegion(id);chips.append(b)});
  if(ids.length>LIM){const m=document.createElement('button');m.className='chip';m.textContent=chipsAll?'收合':'更多 '+(ids.length-LIM)+' 個';m.onclick=()=>{chipsAll=!chipsAll;renderMap()};chips.append(m)}
  if(mapSel&&!regionIndex[mapSel])mapSel=null;
  paintMapNews();markMapNow();
}
function selectRegion(id){mapSel=mapSel===id?null:id;document.querySelectorAll('#mapChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.id===mapSel));for(const k in mapPaths)mapPaths[k].classList.toggle('sel',k===mapSel);paintMapNews()}
function paintMapNews(){
  const box=$('mapNews');box.replaceChildren();const r=mapSel&&regionIndex[mapSel];if(!r)return;
  const h=document.createElement('h4');h.textContent=WM.name(mapSel)+' · '+r.list.length+' 則新聞';box.append(h);
  r.list.forEach((a,i)=>{const b=document.createElement('button'),d=document.createElement('i');d.style.background=CAT_COLOR[a.category];b.append(d,a.title);b.onclick=()=>playFrom(r.list,i,'');box.append(b)});
}
/* 正在播的新聞提到的地區，地圖上加白框 */
function markMapNow(){
  if(!mapPaths)return;const a=queue[idx],ids=a?new Set(WM.detect(a.title+' '+(a.summary||''))):new Set();
  for(const k in mapPaths)mapPaths[k].classList.toggle('now',ids.has(k)&&!!regionIndex[k]);
}

/* ---------- 迷你播放列：往下滑看新聞時顯示 ---------- */
function paintMini(){
  const a=queue[idx];
  $('mini').classList.toggle('show',!ctlVisible&&!!a);
  if(a){$('miniTitle').textContent=a.title;$('miniMeta').textContent=a.category+' · '+a.source;$('miniCov').className='mcov k-'+a.category}
}
if('IntersectionObserver' in window)new IntersectionObserver(([e])=>{ctlVisible=e.isIntersecting;paintMini()}).observe($('ctl'));
$('miniMain').onclick=scrollToPlayer;
$('collapse').onclick=()=>{const on=$('player').classList.toggle('compact-on');$('collapse').setAttribute('aria-expanded',String(!on))};

/* ---------- 取得新聞 ----------
   1. 先向自己網站的 /api/news 要整理好的新聞（網站連結 GitHub 部署時，由 Netlify 伺服器整理，最快最穩）
   2. 沒有伺服器（手動上傳版）時，改由手機經公開轉接服務抓取 */
async function fetchRaw(url,ms){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return r}
  finally{clearTimeout(timer)}
}
const fetchJSON=async(u,ms)=>(await fetchRaw(u,ms)).json();
const fetchText=async(u,ms)=>(await fetchRaw(u,ms)).text();
async function loadFromServer(fresh){
  try{const d=await fetchJSON('/api/news'+(fresh?'?fresh='+Date.now():''),fresh?15000:10000);return d&&Array.isArray(d.articles)&&d.articles.length?d:null}catch(e){return null}
}
/* 手機直接抓：同時向 rss2json、allorigins 要資料，先到先用；都失敗再試 codetabs */
async function getItems(url){
  const a=fetchJSON('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url),7000).then(d=>{if(d.status!=='ok'||!d.items||!d.items.length)throw Error('rss2json');return d.items});
  const b=fetchText('https://api.allorigins.win/raw?url='+encodeURIComponent(url),7000).then(t=>{const it=R.parseFeed(t);if(!it.length)throw Error('allorigins');return it});
  try{return await Promise.any([a,b])}catch(e){}
  const it=R.parseFeed(await fetchText('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url),7000));
  if(!it.length)throw Error('沒有資料');return it;
}
async function fetchSource(src){
  const routes=[[src.url,!!src.gn]].concat(src.alt?[[src.alt,true]]:[]);
  let err;
  for(const [u,gn] of routes){try{return{items:await getItems(u),gn}}catch(e){err=e}}
  throw err||Error('沒有資料');
}
/* 手機直接抓時的翻譯：Google 翻譯免費介面；直接連線失敗兩次就改走轉接服務 */
const TR=store.get(TR_KEY,{});
const trLookup=(sl,t)=>TR[R.trKey(sl,t)];
function trSave(){const k=Object.keys(TR);if(k.length>1200)k.slice(0,k.length-900).forEach(x=>delete TR[x]);store.set(TR_KEY,TR)}
const TR_ROUTES=[{wrap:u=>u,fails:0},{wrap:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),fails:0},{wrap:u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),fails:0}];
async function trChunk(sl,list){
  for(const r of TR_ROUTES){
    if(r.fails>=2)continue;
    try{
      const out=R.gtxLines(await fetchJSON(r.wrap(R.gtxURL(sl,list)),8000),list.length);
      r.fails=0;
      if(out)return out;
      if(list.length===1)return null;
      const h=Math.ceil(list.length/2),a=await trChunk(sl,list.slice(0,h)),b=a&&await trChunk(sl,list.slice(h));
      return a&&b?a.concat(b):null;
    }catch(e){r.fails++}
  }
  return null;
}
const trPending=new Set();let trQueue=[],trBusy=0,trDone=0,trTotal=0,trWaiters=[];
function enqueueTranslation(items){
  const chunks=R.chunkJobs(R.translationJobs(items),(sl,t)=>!!trLookup(sl,t)||trPending.has(R.trKey(sl,t)),1200);
  chunks.forEach(([sl,list])=>{list.forEach(t=>trPending.add(R.trKey(sl,t)));trTotal+=list.length});
  trQueue.push(...chunks);pumpTranslation();
}
function pumpTranslation(){
  while(trBusy<2&&trQueue.length){
    const [sl,list]=trQueue.shift();trBusy++;
    trChunk(sl,list).then(out=>{if(out)list.forEach((t,i)=>{TR[R.trKey(sl,t)]=out[i]})}).catch(()=>{})
      .finally(()=>{list.forEach(t=>trPending.delete(R.trKey(sl,t)));trDone+=list.length;trBusy--;firstBatch();progress();pumpTranslation();
        if(!trBusy&&!trQueue.length){const w=trWaiters;trWaiters=[];w.forEach(f=>f())}});
  }
}
const translationDone=()=>new Promise(res=>{if(!trBusy&&!trQueue.length)res();else trWaiters.push(res)});

/* 載入中只先顯示第一批，其餘等全部整理完再一次更新，畫面不會跳來跳去 */
let clientRaw=[],shownThisLoad=false,firstTimer=0,srcDone=0;
function firstBatch(){if(shownThisLoad)return;clearTimeout(firstTimer);firstTimer=setTimeout(()=>{if(!shownThisLoad)applyArticles(R.finalize(clientRaw,trLookup).list,false)},300)}
function applyArticles(list,final){
  if(!list.length||(!final&&shownThisLoad))return;
  shownThisLoad=true;articles=list;loadedOnce=true;
  syncQueue();renderShelves();
}
/* 更新播放清單，但不打斷、不更換正在顯示的這則 */
function syncQueue(){
  if(!queue.length){queue=digest();idx=0;autoQueue=true;queueKey='';setArticle();return}
  if(!autoQueue||isPlaying()||mode==='paused')return;
  const cur=queue[idx],d=digest(),k=cur?d.findIndex(x=>x.link===cur.link):-1;
  if(k>=0){queue=d;idx=k;const n=d[k];if(n.title!==cur.title||n.summary!==cur.summary||n.intro!==cur.intro)setArticle();else paintMeta()}
  else if(d.length){queue=d;idx=0;setArticle()}
}
function progress(){if(loading)$('newsStatus').textContent=`更新中 ${srcDone}/${R.SOURCES.length}`+(trTotal?` · 翻譯 ${trDone}/${trTotal}`:'')}
async function loadClient(){
  clientRaw=[];srcDone=0;trDone=trTotal=0;
  const seen=new Set();
  await Promise.all(R.SOURCES.map(async src=>{
    try{
      const r=await fetchSource(src);
      const l=R.normalize(src,r.items,r.gn).filter(x=>!seen.has(x.link)&&seen.add(x.link));
      clientRaw.push(...l);enqueueTranslation(l);firstBatch(); /* 中文來源不必翻譯，會最先出現 */
    }catch(e){}
    srcDone++;progress();
  }));
  await translationDone();trSave();clearTimeout(firstTimer);
  return R.finalize(clientRaw,trLookup).list;
}
async function load(fresh){
  if(loading)return;loading=true;
  const btn=$('refresh');btn.classList.add('spin');btn.disabled=true;
  shownThisLoad=articles.length>0;
  $('newsStatus').textContent='更新中…';
  try{
    const d=await loadFromServer(fresh);
    const list=d?d.articles:await loadClient();
    lastUpdated=d&&d.updated||Date.now();
    if(list.length){
      applyArticles(list,true);store.set(CACHE_KEY,{saved:lastUpdated,articles:list});
      $('newsStatus').textContent=`更新於 ${hm(lastUpdated)}`;
    }else{
      loadedOnce=true;renderShelves();
      $('newsStatus').textContent=articles.length?'更新失敗，顯示先前的新聞':'暫時無法取得新聞';
    }
  }finally{
    loading=false;btn.classList.remove('spin');btn.disabled=false;
  }
}
$('refresh').onclick=()=>load(true);

/* ---------- Service Worker（加到主畫面後可離線開啟播放器） ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:')
  addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));

/* ---------- 啟動：先顯示上次的新聞，再到背景更新 ---------- */
const cache=store.get(CACHE_KEY,null);
if(cache&&Array.isArray(cache.articles)&&cache.articles.length){
  articles=cache.articles.filter(a=>CATS.includes(a.category));lastUpdated=cache.saved||0;loadedOnce=true;
  queue=digest();if(queue.length)setArticle();
}
renderShelves();load();
setInterval(()=>{if(document.visibilityState==='visible')load()},600000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!loading&&Date.now()-lastUpdated>600000)load()}); /* 回到畫面時若超過 10 分鐘就更新 */
</script>
