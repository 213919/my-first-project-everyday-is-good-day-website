<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1e24">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>聲讀 DAILY｜新聞稿</title>
<style>
:root{color-scheme:dark;--bg:#1b1e24;--fg:#eef1f4;--mute:#aeb6c0;--line:#ffffff1f;--accent:#9fd3e6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.85 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-bottom:14px}
.bar a{color:var(--accent);text-decoration:none}
h1{font-size:24px;line-height:1.4;margin:0 0 4px}
.meta{color:var(--mute);font-size:14px;margin:0 0 8px}
section{border-top:1px solid var(--line);padding-top:14px;margin-top:20px}
h2{font-size:21px;margin:0 0 4px}
h3{font-size:14px;color:var(--mute);font-weight:600;margin:16px 0 4px;letter-spacing:1px}
p{margin:0 0 10px}
p.notice{color:#ffd88a}
p.src{color:var(--mute);font-size:16px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a href="/">← 回播放器</a><a href="#" id="openSafari" hidden>在 Safari 開啟</a></div>
  <main><article id="doc"><p class="empty">新聞稿準備中…</p></article></main>
</div>

<script src="/rules.js"></script>
<script>
'use strict';
const R=window.NewsRules,$=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}};
const NUM=['一','二','三','四','五','六','七','八','九','十'];
const fmt=t=>new Date(t).toLocaleString('zh-TW',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});

/* 從主畫面 App 開啟時，提供改用 Safari 開啟的連結（Safari 才有「聆聽頁面」；iOS 17 以上） */
if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches){const a=$('openSafari');a.hidden=false;a.href='x-safari-'+location.href}

async function getList(){
  const l=store.get('news-listen',null); /* 播放器帶過來的清單 */
  if(l&&Array.isArray(l.list)&&l.list.length&&Date.now()-(l.at||0)<6*3600e3)return{list:l.list,saved:l.saved};
  try{const r=await fetch('/api/news');if(r.ok){const d=await r.json();if(d.articles&&d.articles.length)return{list:d.articles,saved:d.updated}}}catch(e){}
  const c=store.get('news-v6',null);
  if(c&&Array.isArray(c.articles)&&c.articles.length)return{list:c.articles,saved:c.saved};
  return null;
}
/* 依四大板塊分段；每則只放朗讀內容（不重複板塊開場白） */
function render(data){
  const doc=$('doc');doc.replaceChildren();
  if(!data){const p=document.createElement('p');p.className='empty';p.textContent='目前沒有新聞，請回播放器重新整理後再試。';doc.append(p);return}
  const h=document.createElement('h1');h.textContent='聲讀 DAILY 今日重點';
  const m=document.createElement('p');m.className='meta';m.textContent=data.saved?fmt(data.saved):'';
  doc.append(h,m);
  R.CATS.forEach(c=>{
    const items=data.list.filter(a=>a.category===c).slice(0,R.PER_CAT);if(!items.length)return;
    const sec=document.createElement('section'),h2=document.createElement('h2');h2.textContent=c;sec.append(h2);
    items.forEach((a,i)=>{
      const h3=document.createElement('h3');h3.textContent=`第${NUM[i]||i+1}則`;sec.append(h3);
      R.buildScript(Object.assign({},a,{intro:''})).paras.forEach(p=>{const el=document.createElement('p');el.className=p.kind==='notice'?'notice':p.kind==='source'?'src':'';el.textContent=p.sents.join('');sec.append(el)});
    });
    doc.append(sec);
  });
}
getList().then(render);
</script>
</body>
</html>
