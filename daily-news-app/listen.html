<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1e24">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>聲讀 DAILY｜新聞稿</title>
<style>
:root{color-scheme:dark;--bg:#1b1e24;--fg:#eef1f4;--mute:#aeb6c0;--line:#ffffff1f;--accent:#9fd3e6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.85 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-bottom:12px}
.bar a{color:var(--accent);text-decoration:none}
.how{background:#2b3038;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.75;margin-bottom:22px}
.how b{display:block;font-size:15.5px;margin-bottom:4px}
.how p{margin:6px 0}
.how .small{color:var(--mute);font-size:13px}
.how .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.how button,.how a.btn{font:inherit;font-size:14px;color:#1b1e24;background:#fff;border:0;border-radius:12px;padding:8px 14px;text-decoration:none;cursor:pointer}
.how button.ghost{background:#ffffff14;color:var(--fg)}
.how.hide{display:none}
h1{font-size:24px;line-height:1.4;margin:0 0 4px}
.meta{color:var(--mute);font-size:14px;margin:0 0 20px}
section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
h2{font-size:15px;color:var(--mute);font-weight:600;margin:0 0 6px;letter-spacing:1px}
p{margin:0 0 10px}
p.notice{color:#ffd88a}
p.src{color:var(--mute);font-size:16px}
.end{color:var(--mute);margin-top:26px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a href="/">← 回播放器</a><a href="#" id="showHow" hidden>使用說明</a></div>

  <aside class="how" id="how">
    <b>用 iPhone 的 Siri 聲音朗讀這份新聞稿</b>
    <p id="m1"><strong>方法一（推薦）</strong>：點 Safari 網址列旁的選單（「大小」或「⋯」）→「聆聽頁面」，鎖定螢幕也能繼續聽。</p>
    <p id="m1app" hidden><strong>方法一（推薦）</strong>：按下方「在 Safari 開啟」，再點網址列旁的選單 →「聆聽頁面」，鎖定螢幕也能繼續聽。</p>
    <p><strong>方法二</strong>：開啟「設定 → 輔助使用 → 語音內容 → 朗讀螢幕」，按「隱藏說明」後，用兩指從螢幕最上方往下滑。</p>
    <p class="small">聲音與語速依「語音內容」的設定（例如 Siri 聲音 2）。</p>
    <div class="row"><button id="hide">隱藏說明</button><a class="btn" id="openSafari" href="#" hidden>在 Safari 開啟</a></div>
  </aside>

  <main>
    <article id="doc"><p class="empty">新聞稿準備中…</p></article>
  </main>
</div>

<script src="/rules.js"></script>
<script>
'use strict';
const R=window.NewsRules,$=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const NUM=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
const fmt=t=>new Date(t).toLocaleString('zh-TW',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});

/* 說明：從主畫面 App 開啟時無法用 Safari「聆聽頁面」，提供改用 Safari 開啟的連結（iOS 17 以上） */
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
if(standalone){$('m1').hidden=true;$('m1app').hidden=false;const a=$('openSafari');a.hidden=false;a.href='x-safari-'+location.href}
function showHow(on){$('how').classList.toggle('hide',!on);$('showHow').hidden=on;store.set('listen-how-hidden',!on)}
showHow(!store.get('listen-how-hidden',false));
$('hide').onclick=()=>{showHow(false);window.scrollTo(0,0)};
$('showHow').onclick=e=>{e.preventDefault();showHow(true)};

/* 約五分鐘快訊：各類輪流取（沒有從播放器帶清單過來時使用） */
function brief(articles){
  const cats=['全球政治','全球經濟','官方原始資料','台灣財經','科技'],pools=cats.map(c=>articles.filter(a=>a.category===c)),out=[];
  for(let r=0;r<10&&out.length<10;r++)for(const p of pools)if(p[r]&&out.length<10)out.push(p[r]);
  return out;
}
async function getList(){
  const l=store.get('news-listen',null); /* 播放器按「用 Siri 聲音聽」時帶過來的清單 */
  if(l&&Array.isArray(l.list)&&l.list.length&&Date.now()-(l.at||0)<6*3600e3)return{list:l.list,saved:l.saved};
  try{const r=await fetch('/api/news');if(r.ok){const d=await r.json();if(d.articles&&d.articles.length)return{list:brief(d.articles),saved:d.updated}}}catch(e){}
  const c=store.get('news-v5',null);
  if(c&&Array.isArray(c.articles)&&c.articles.length)return{list:brief(c.articles),saved:c.saved};
  return null;
}
function render(data){
  const doc=$('doc');doc.replaceChildren();
  if(!data){const p=document.createElement('p');p.className='empty';p.textContent='目前沒有新聞資料。請先回播放器載入新聞，再按「用 Siri 聲音聽」。';doc.append(p);return}
  const h=document.createElement('h1');h.textContent='聲讀 DAILY 新聞稿';
  const m=document.createElement('p');m.className='meta';m.textContent=`${data.saved?fmt(data.saved)+' 整理':''} · 共 ${data.list.length} 則`;
  doc.append(h,m);
  data.list.forEach((a,i)=>{
    const sec=document.createElement('section'),h2=document.createElement('h2');
    h2.textContent=`第${NUM[i]||i+1}則・${a.category}`;sec.append(h2);
    R.buildScript(a).paras.forEach(p=>{const el=document.createElement('p');el.className=p.kind==='notice'?'notice':p.kind==='source'?'src':'';el.textContent=p.sents.join('');sec.append(el)});
    doc.append(sec);
  });
  const e=document.createElement('p');e.className='end';e.textContent='以上是這份新聞稿的全部內容。英文報導為機器翻譯，重要資訊請以原文為準。';doc.append(e);
}
getList().then(render);
</script>
</body>
</html>
