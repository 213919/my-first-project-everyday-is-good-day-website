<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#1b1e24">
<link rel="manifest" href="/daily-news.webmanifest">
<link rel="apple-touch-icon" href="/images/daily-news-180.png">
<link rel="icon" type="image/png" href="/images/daily-news-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="聲讀">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>聲讀｜每日全球政經科技</title>
<style>
:root{color-scheme:dark;--bg:#1b1e24;--card:#363c46;--sheet:#2b3038;--fg:#fff;--mute:#aeb6c0;--line:#ffffff1f;--accent:#9fd3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"Noto Sans TC",sans-serif}
button,select,input{font:inherit;color:inherit}
html{-webkit-text-size-adjust:100%}
button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.line,.paper{-webkit-touch-callout:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
svg{display:block;fill:currentColor}
.ico{width:26px;height:26px}
.shell{max-width:440px;margin:0 auto;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column}
.install{display:none;margin:0 0 10px;padding:12px 14px;border-radius:16px;background:#ffffff14;border:1px solid var(--line);font-size:13px;line-height:1.7;color:#e6ebf0}
.install.show{display:flex;gap:10px;align-items:flex-start}
.install span{flex:1}
.install button{padding:4px 8px;color:var(--mute);font-size:13px}
.player{flex:1;background:var(--card);border-radius:26px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #0007}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff}
.top button{padding:6px;border-radius:10px}
.top .brand{font-size:13px;color:var(--mute);letter-spacing:2px}
.chev{transition:transform .2s}
.compact-on .chev{transform:rotate(180deg)}

/* 逐字稿卡片 */
.paper{position:relative;border-radius:24px;background:linear-gradient(#fff,#eaeef2);color:#11151a;display:flex;flex-direction:column;overflow:hidden}
.paper .tagrow{padding:14px 18px 0;font-size:12px;color:#5a6470;display:flex;gap:8px;align-items:center;min-height:30px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid currentColor}
.t-全球政治{color:#b4452f}.t-全球經濟{color:#9a6b00}.t-財經{color:#2c7a4b}.t-科技{color:#2b64b0}
.script{position:relative;height:min(42dvh,360px);overflow:auto;overscroll-behavior:contain;padding:10px 18px 14px;scroll-behavior:smooth}
.compact-on .script{height:112px}
.line{display:block;width:100%;text-align:left;padding:7px 0;font-size:20px;line-height:1.6;font-weight:650;color:#7a838e;transition:color .2s}
.line .r{color:#11151a}
.line.past{color:#a4acb6}
.line.active{color:#4d5763}
.line.active .r{color:#11151a}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;padding:0 18px 10px;flex:none}
.wave i{display:block;width:3px;height:100%;border-radius:2px;background:#232a33;transform:scaleY(var(--h));transform-origin:center;opacity:.55}
.playing .wave i{animation:eq 1s ease-in-out infinite alternate;animation-delay:var(--d);opacity:.9}
@keyframes eq{from{transform:scaleY(calc(var(--h)*.35))}to{transform:scaleY(var(--h))}}

/* 標題列 */
.info{display:flex;justify-content:space-between;align-items:center;gap:12px}
.info h1{font-size:17px;line-height:1.45;margin:0;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info small{color:var(--mute);font-size:13px}
.info>div{min-width:0}
.info button{flex:none;padding:6px}

/* 進度 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#ffffff80;border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:#ffffff80;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.pos{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-6px}

/* 控制 */
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ctl .side{justify-self:center;min-width:48px;height:44px;border-radius:12px;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ctl .side[aria-pressed=true]{color:var(--accent)}
.mid{display:flex;align-items:center;gap:14px}
.mid .skip{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
#play{width:58px;height:58px;border-radius:50%;background:#fff;color:#1b1e24;display:grid;place-items:center}
#play svg{width:30px;height:30px}
.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
#fav[aria-pressed=true]{color:#ff6b81}
#fav[aria-pressed=false] svg path{fill:none;stroke:currentColor;stroke-width:2}
.status{font-size:12.5px;line-height:1.7;color:var(--mute);margin:0;min-height:1.7em}
.status.warn{color:#ffd88a}
.foot{font-size:11.5px;color:#8b95a1;line-height:1.7;padding:10px 6px 0}

/* 底部面板 */
dialog.sheet{border:0;margin:auto auto 0;width:min(100%,480px);max-height:88dvh;border-radius:24px 24px 0 0;background:var(--sheet);color:#fff;padding:0;overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#000a}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sh-head b{font-size:17px}
.sh-body{overflow:auto;padding:4px 18px 22px}
.btn{background:#ffffff14;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.btn:hover{background:#ffffff26}
.btn:disabled{opacity:.5}
.btn.primary{background:#fff;color:#1b1e24;border-color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#ffffff0f;font-size:13.5px}
.chips button[aria-pressed=true]{background:#fff;color:#1b1e24;border-color:#fff}
input[type=search],select{width:100%;background:#ffffff12;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:15px}
select option{color:#000}
ul.list{list-style:none;margin:8px 0 0;padding:0}
.item{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid #ffffff14}
.item.active{background:#ffffff10;border-radius:12px;padding-left:10px}
.item .tag{margin-right:6px}
.item .t-全球政治{color:#ffb4a2}.item .t-全球經濟{color:#ffd88a}.item .t-財經{color:#9fe0b4}.item .t-科技{color:#9cc9ff}
.item h3{font-size:15.5px;line-height:1.55;margin:6px 0 2px;font-weight:600}
.item small{color:var(--mute);font-size:12.5px}
.item a{color:#c6e7ff;margin-left:8px;font-size:12.5px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.field{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.diag{font-size:12.5px;line-height:1.9;color:var(--mute);background:#ffffff0c;border-radius:12px;padding:10px 12px;margin-top:14px;white-space:pre-line}
@media(min-width:520px){.shell{padding:28px 12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
<div class="install" id="install" role="note"><span>📲 加到主畫面：點 Safari 下方的「分享」圖示 →「加入主畫面」，之後就能像 App 一樣全螢幕開啟。</span><button id="installClose" aria-label="關閉提示">關閉</button></div>
<section class="player" id="player" aria-label="新聞播放器">
  <div class="top">
    <button id="collapse" aria-label="收合／展開逐字稿" aria-expanded="true"><svg class="ico chev" viewBox="0 0 24 24"><path d="M3.5 8.5 12 17l8.5-8.5-1.4-1.4L12 14.2 4.9 7.1z"/></svg></button>
    <span class="brand">聲讀 DAILY</span>
    <button id="menu" aria-label="新聞清單"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg></button>
  </div>

  <div class="paper">
    <div class="tagrow" id="tagrow"><span>逐字稿</span></div>
    <div class="script" id="script" aria-live="off"><p class="line">按右上角清單選擇新聞，或直接按播放開始今日快訊。</p></div>
    <div class="wave" id="wave" aria-hidden="true"></div>
  </div>

  <div class="info">
    <div><h1 id="title">先試聽，再開始今日快訊</h1><small id="meta">等待新聞載入</small></div>
    <button id="gear" aria-label="設定與語音測試"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.14 3.14"/><path fill-rule="evenodd" d="M12 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 1 0 0-12.4zm0 3.7a2.5 2.5 0 1 1 0 5 2.5 2.5 0 1 1 0-5z"/></svg></button>
  </div>

  <div>
    <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="句子進度">
    <div class="pos"><span id="position">第 0 / 0 句</span><span id="eta"></span></div>
  </div>

  <div class="ctl">
    <button class="side" id="rateBtn" aria-label="切換語速">1.0x</button>
    <div class="mid">
      <button class="skip" id="prev" aria-label="上一則"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button id="play" aria-label="播放"></button>
      <button class="skip" id="next" aria-label="下一則"><svg class="ico" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <button class="side" id="loop" aria-label="循環播放" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>

  <div class="bottom">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zM16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量">
    <button id="fav" aria-label="收藏這則" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
  </div>
  <p id="audio" class="status" role="status">請先按播放；若沒聲音，點右上角齒輪做語音測試。空白鍵可播放／暫停。</p>
</section>
<p class="foot">僅朗讀來源提供的標題與摘要，非新聞全文，亦非獨立查證的分析；分類為依來源與關鍵字自動判定，可能有誤。新聞來自第三方 RSS 服務，可用性不保證。</p>
</div>

<!-- 新聞清單 -->
<dialog class="sheet" id="listDlg" aria-label="新聞清單">
  <div class="sh-head"><b>新聞清單</b><button id="listClose" aria-label="關閉"><svg class="ico" viewBox="0 0 24 24"><path d="M5.6 4.2 12 10.6l6.4-6.4 1.4 1.4-6.4 6.4 6.4 6.4-1.4 1.4-6.4-6.4-6.4 6.4-1.4-1.4 6.4-6.4-6.4-6.4z"/></svg></button></div>
  <div class="sh-body">
    <div class="row">
      <button class="btn primary" id="daily">約五分鐘快訊</button>
      <button class="btn" id="world">全球政經快訊</button>
      <button class="btn" id="refresh">更新新聞</button>
    </div>
    <input id="q" type="search" placeholder="搜尋標題／摘要" aria-label="搜尋新聞">
    <div class="row chips" id="cats" role="group" aria-label="分類篩選"></div>
    <p id="newsStatus" class="status" role="status">正在載入新聞…</p>
    <ul class="list" id="list"></ul>
  </div>
</dialog>

<!-- 設定 -->
<dialog class="sheet" id="setDlg" aria-label="設定">
  <div class="sh-head"><b>語音設定</b><button id="setClose" aria-label="關閉"><svg class="ico" viewBox="0 0 24 24"><path d="M5.6 4.2 12 10.6l6.4-6.4 1.4 1.4-6.4 6.4 6.4 6.4-1.4 1.4-6.4-6.4-6.4 6.4-1.4-1.4 6.4-6.4-6.4-6.4z"/></svg></button></div>
  <div class="sh-body">
    <button class="btn primary" id="test">測試中文語音</button>
    <label class="field" for="voice">中文語音</label>
    <select id="voice"><option value="">系統預設中文語音</option></select>
    <div class="diag" id="diag"></div>
  </div>
</dialog>

<script>
'use strict';
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
const CATS=['全部','全球政治','全球經濟','財經','科技','收藏'];
const ALL4=['全球政治','全球經濟','財經','科技'];
/* [來源, 預設分類, RSS 網址, 是否綜合來源（以關鍵字再分類）] */
const SOURCES=[
 ['BBC 中文','全球政治','https://feeds.bbci.co.uk/zhongwen/trad/rss.xml',1],
 ['德國之聲','全球政治','https://rss.dw.com/rdf/rss-chi-all',1],
 ['紐約時報中文','全球政治','https://cn.nytimes.com/rss/zh-hant/',1],
 ['聯合國新聞','全球政治','https://news.un.org/feed/subscribe/zh/news/all/rss.xml',1],
 ['中央社國際','全球政治','https://www.cna.com.tw/rss/intworld.xml',1],
 ['自由時報國際','全球政治','https://news.ltn.com.tw/rss/world.xml',1],
 ['中央社財經','財經','https://www.cna.com.tw/rss/finance.xml',0],
 ['自由時報財經','財經','https://news.ltn.com.tw/rss/business.xml',0],
 ['科技新報','科技','https://technews.tw/feed/',0]
];
const ECON=/經濟|通膨|通脹|物價|利率|升息|降息|央行|聯準會|關稅|貿易|貨幣|匯率|股市|債|油價|能源|供應鏈|財政|赤字|失業|就業|景氣|衰退|成長|GDP|IMF|世銀|世界銀行|經貿|出口|進口|投資|銀行|OPEC/i;
const POL=/選舉|總統|總理|首相|議會|國會|戰爭|衝突|停火|談判|外交|峰會|聯合國|北約|軍|飛彈|地緣|川普|拜登|普廷|普京|習近平|烏克蘭|加薩|以色列|伊朗|台海|北韓|歐盟/;
const MAX_AGE=3*864e5;
const RATES=[0.8,1,1.2,1.4];
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

let articles=[],queue=[],idx=0,lines=[],nodes=[],sentence=0,mode='idle',token=0,voices=[],category='全部',keyword='',loading=false,watchdog,
    current=null,lastCancel=0,loop=false,rate=1,favs=[],unlocked=false;

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function status(t,warn){const e=$('audio');e.textContent=t;e.classList.toggle('warn',!!warn)}

/* ---------- 語音：初始化 ---------- */
const inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger|MQQBrowser|; wv\)/i.test(navigator.userAgent);
function populate(){
  if(!synth)return;
  voices=synth.getVoices().filter(v=>/^zh|^cmn|^yue/i.test(v.lang));
  const saved=store.get('news-voice',''),sel=$('voice');
  sel.replaceChildren(new Option('系統預設中文語音',''));
  voices.forEach((v,i)=>sel.add(new Option(v.name+' · '+v.lang,String(i))));
  const si=voices.findIndex(v=>v.name===saved);
  if(si>=0)sel.value=String(si);
  else{const i=voices.findIndex(v=>/TW|Hant/i.test(v.lang));if(i>=0)sel.value=String(i)}
  diag();
}
function diag(){
  const lines=[
    '語音功能：'+(synth?'支援':'不支援'),
    '中文語音數：'+voices.length+(synth&&!voices.length?'（尚未偵測到，請見下方建議）':''),
    '目前語音：'+(voices[Number($('voice').value)]?.name||'系統預設'),
    '引擎狀態：'+(synth?(synth.speaking?'朗讀中':synth.paused?'暫停':'待命'):'—')
  ];
  if(inApp)lines.push('⚠ 偵測到 App 內建瀏覽器（LINE／FB 等），常不支援語音，請改用 Chrome 或 Safari 開啟。');
  if(synth&&!voices.length)lines.push('建議：Android 到「設定→系統→語言→文字轉語音」安裝／啟用中文語音（Google 文字轉語音）；iPhone 到「設定→輔助使用→語音內容→聲音」下載中文語音，並確認未開靜音鍵、媒體音量已調高。');
  $('diag').textContent=lines.join('\n');
}
if(synth){
  populate();synth.addEventListener('voiceschanged',populate);
  let tries=0;const poll=setInterval(()=>{if(voices.length||++tries>10)clearInterval(poll);else populate()},500); /* Android 常延遲才有語音清單 */
}else status('此瀏覽器不支援語音合成，請改用 Chrome 或 Safari。',true);
if(inApp)status('偵測到 App 內建瀏覽器，可能無法發聲；請改用 Chrome 或 Safari 開啟。',true);

/* iOS／部分瀏覽器：第一次互動時先「解鎖」語音引擎 */
function unlock(){
  if(unlocked||!synth)return;unlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;synth.speak(u)}catch(e){}
}
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));

/* ---------- 設定值 ---------- */
rate=store.get('news-rate',1);loop=store.get('news-loop',false);favs=store.get('news-favs',[]);
$('vol').value=store.get('news-vol',1);
function paintRate(){$('rateBtn').textContent=rate.toFixed(1)+'x'}
function paintLoop(){$('loop').setAttribute('aria-pressed',String(loop))}
paintRate();paintLoop();
$('rateBtn').onclick=()=>{let i=RATES.indexOf(rate);rate=RATES[(i+1)%RATES.length];store.set('news-rate',rate);paintRate();eta()};
$('loop').onclick=()=>{loop=!loop;store.set('news-loop',loop);paintLoop()};
$('vol').onchange=()=>store.set('news-vol',Number($('vol').value));
$('voice').onchange=()=>{const v=voices[Number($('voice').value)];store.set('news-voice',v?v.name:'');diag()};

/* ---------- 播放核心 ---------- */
function setPlayIcon(on){$('play').innerHTML=on?ICON_PAUSE:ICON_PLAY;$('play').setAttribute('aria-label',on?'暫停':'播放');$('player').classList.toggle('playing',on)}
setPlayIcon(false);
function halt(){token++;clearTimeout(watchdog);if(synth){synth.cancel();lastCancel=Date.now()}}
function cancel(){halt();mode='idle';setPlayIcon(false);setSession('none')}
function clean(s){const d=new DOMParser().parseFromString(s||'','text/html');d.querySelectorAll('script,style').forEach(n=>n.remove());return(d.body.textContent||'').replace(/\s+/g,' ').trim()}
const ABBR=[[/TechNews/gi,'科技新報'],[/\bAI\b/g,'人工智慧'],[/\bGDP\b/g,'國內生產毛額'],[/\bETF\b/g,'指數股票型基金'],
 [/\bFed\b/g,'聯準會'],[/\bIMF\b/g,'國際貨幣基金'],[/\bWTO\b/g,'世界貿易組織'],[/\bOPEC\+?/g,'石油輸出國組織'],
 [/\bNATO\b/g,'北約'],[/\bEU\b/g,'歐盟'],[/\bUN\b/g,'聯合國'],[/\bUSA?\b/g,'美國'],[/\bG7\b/g,'七大工業國集團'],
 [/\bG20\b/g,'二十國集團'],[/\bCPI\b/g,'消費者物價指數'],[/\bECB\b/g,'歐洲央行'],[/\bIPO\b/g,'首次公開募股'],
 [/\bEV\b/g,'電動車'],[/\bChatGPT\b/gi,'聊天機器人'],[/\bNVIDIA\b/gi,'輝達'],[/\bTSMC\b/g,'台積電']];
function spoken(s){
  ABBR.forEach(([r,t])=>{s=s.replace(r,t)});
  let n=0;
  s=s.replace(/[A-Za-z][A-Za-z0-9 .+&'-]*/g,()=>n++?'':'（外文名稱略）');
  return s.replace(/\s+/g,' ').trim();
}
/* 以句號切句；過長再以逗號切，避免 Chrome 長句中斷 */
function splitSentences(t){
  const out=[];
  (t.match(/[^。！？!?；;]+[。！？!?；;]?/g)||[]).forEach(s=>{
    if(s.length<=70){out.push(s);return}
    let buf='';(s.match(/[^，、,]+[，、,]?/g)||[s]).forEach(p=>{if((buf+p).length>60&&buf){out.push(buf);buf=p}else buf+=p});if(buf)out.push(buf);
  });
  return out;
}
function eta(){
  const chars=lines.slice(sentence).join('').length,sec=Math.round(chars/(4.2*rate));
  $('eta').textContent=lines.length?('約剩 '+(sec>=60?Math.floor(sec/60)+' 分 ':'')+(sec%60)+' 秒'):'';
}

function setArticle(){
  const a=queue[idx];if(!a)return;sentence=0;
  lines=[a.category+'消息。',spoken(a.title)+'。',...splitSentences(spoken(a.summary)||'來源未提供摘要。')].filter(t=>t.trim());
  $('title').textContent=a.title;
  $('meta').textContent=`${a.source} · ${ago(a.time)} · 第 ${idx+1}/${queue.length} 則`;
  $('tagrow').innerHTML='';const tg=document.createElement('span');tg.className='tag t-'+a.category;tg.textContent=a.category;
  const lb=document.createElement('span');lb.textContent='逐字稿';$('tagrow').append(tg,lb);
  const sc=$('script');sc.replaceChildren();nodes=[];
  lines.forEach((t,i)=>{
    const b=document.createElement('button'),r=document.createElement('span'),u=document.createElement('span');
    b.className='line';r.className='r';u.textContent=t;b.append(r,u);
    b.onclick=()=>{unlock();seekTo(i,true)};sc.append(b);nodes.push({b,r,u});
  });
  highlight();paintList();paintFav();updateSession(a);
}
function setRead(i,n){const nd=nodes[i];if(!nd)return;nd.r.textContent=lines[i].slice(0,n);nd.u.textContent=lines[i].slice(n)}
function highlight(){
  const seek=$('seek');seek.max=Math.max(1,lines.length-1);seek.value=sentence;
  $('position').textContent=`第 ${Math.min(sentence+1,lines.length)} / ${lines.length} 句`;eta();
  nodes.forEach((nd,i)=>{
    nd.b.classList.toggle('active',i===sentence);nd.b.classList.toggle('past',i<sentence);
    setRead(i,0);
  });
  const sc=$('script'),n=nodes[sentence]?.b;
  if(n)sc.scrollTo({top:Math.max(0,n.offsetTop-sc.clientHeight/2+n.offsetHeight/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function seekTo(i,play){
  const was=mode==='playing'||mode==='starting';
  halt();sentence=Math.max(0,Math.min(lines.length-1,i));highlight();
  if(play||was){mode='idle';speakLine()}else{mode='paused';setPlayIcon(false)}
}
$('seek').onchange=()=>{unlock();seekTo(Number($('seek').value),false)};

function speakLine(){
  if(!synth){status('此瀏覽器不支援語音合成。',true);return}
  if(!lines.length){status('尚無新聞可播報。');return}
  if(sentence>=lines.length){
    if(idx+1<queue.length){idx++;setArticle()}
    else if(loop&&queue.length){idx=0;setArticle()}
    else{mode='ended';setPlayIcon(false);status('快訊播報完畢。');setSession('none');return}
  }
  const t=token,si=sentence,u=new SpeechSynthesisUtterance(lines[sentence]);
  current=u; /* 保留參考，避免被垃圾回收導致 onend 不觸發、朗讀中斷 */
  const v=voices[Number($('voice').value)];
  u.lang=v?v.lang:'zh-TW';if(v)u.voice=v;
  u.rate=rate;u.volume=Number($('vol').value);
  mode='starting';setPlayIcon(true);highlight();
  u.onstart=()=>{if(t!==token)return;clearTimeout(watchdog);mode='playing';setSession('playing');status('正在朗讀。')};
  u.onboundary=e=>{if(t===token&&si===sentence&&e.name!=='sentence')setRead(si,e.charIndex+(e.charLength||0))};
  u.onend=()=>{if(t!==token)return;clearTimeout(watchdog);sentence++;speakLine()};
  u.onerror=e=>{
    if(t!==token||e.error==='canceled'||e.error==='interrupted')return;
    clearTimeout(watchdog);mode='error';setPlayIcon(false);
    const m={'not-allowed':'瀏覽器擋下自動發聲，請再按一次播放。','synthesis-unavailable':'此裝置沒有可用的語音引擎或中文語音，請看設定內建議。','language-unavailable':'此裝置沒有中文語音，請看設定內建議。','audio-busy':'音訊裝置忙碌中，請稍後再試。'}[e.error];
    status(m||('語音錯誤：'+e.error+'。可重試或更換中文語音。'),true);
  };
  watchdog=setTimeout(()=>{if(t===token&&mode==='starting')status('尚未收到發聲訊號：請確認媒體音量（iPhone 另需關閉靜音）、已安裝中文語音，或改用 Chrome／Safari。點齒輪可做語音測試。',true)},5000);
  const go=()=>{if(t!==token)return;try{if(synth.paused)synth.resume();synth.speak(u)}catch(err){status('無法啟動語音：'+err.message,true)}};
  /* cancel 後立即 speak 在 Chrome 可能被吃掉，需稍等 */
  const wait=180-(Date.now()-lastCancel);wait>0?setTimeout(go,wait):go();
}
function togglePlay(){
  if(!synth)return;unlock();
  if(mode==='playing'||mode==='starting'){halt();mode='paused';setPlayIcon(false);setSession('paused');status('已暫停；按播放會從本句重新開始。');return}
  if(!queue.length){status('尚無新聞，請稍候或到清單更新。');return}
  if(mode==='ended'){idx=0;setArticle()}
  speakLine();
}
$('play').onclick=togglePlay;
function jump(d){if(!queue.length)return;unlock();halt();idx=Math.max(0,Math.min(queue.length-1,idx+d));setArticle();mode='idle';speakLine()}
$('prev').onclick=()=>jump(-1);$('next').onclick=()=>jump(1);
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||document.querySelector('dialog[open]'))return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);
});

$('test').onclick=()=>{
  unlock();if(!synth){status('此瀏覽器不支援語音。',true);return}
  halt();mode='idle';setPlayIcon(false);populate();
  const t=token,u=new SpeechSynthesisUtterance('這是中文語音測試。如果您聽到這段話，表示目前裝置可以播放中文語音。');current=u;
  const v=voices[Number($('voice').value)];u.lang=v?v.lang:'zh-TW';if(v)u.voice=v;u.volume=Number($('vol').value);
  u.onstart=()=>{if(t===token){status('測試已開始；若沒聽到聲音，請調高媒體音量、關閉靜音，或在上方更換語音。');diag()}};
  u.onend=()=>{if(t===token){status('語音測試結束。');diag()}};
  u.onerror=e=>{if(t===token)status('測試錯誤：'+e.error+'。請看下方診斷建議。',true)};
  const wait=200-(Date.now()-lastCancel);setTimeout(()=>{if(t===token){if(synth.paused)synth.resume();synth.speak(u)}},Math.max(0,wait));
  setTimeout(()=>{if(t===token&&!synth.speaking)status('沒有收到發聲訊號，此裝置／瀏覽器可能不支援中文語音，請看下方診斷。',true);diag()},4000);
};

/* ---------- 鎖定畫面／耳機控制 ---------- */
function setSession(s){try{if('mediaSession' in navigator)navigator.mediaSession.playbackState=s}catch(e){}}
function updateSession(a){
  try{
    if(!('mediaSession' in navigator)||!window.MediaMetadata)return;
    navigator.mediaSession.metadata=new MediaMetadata({title:a.title,artist:a.source,album:'聲讀｜每日全球政經科技'});
    navigator.mediaSession.setActionHandler('play',togglePlay);navigator.mediaSession.setActionHandler('pause',togglePlay);
    navigator.mediaSession.setActionHandler('nexttrack',()=>jump(1));navigator.mediaSession.setActionHandler('previoustrack',()=>jump(-1));
  }catch(e){}
}

/* ---------- 收藏 ---------- */
function isFav(a){return a&&favs.some(f=>f.link===a.link)}
function paintFav(){const on=isFav(queue[idx]);$('fav').setAttribute('aria-pressed',String(on))}
$('fav').onclick=()=>{
  const a=queue[idx];if(!a)return;
  favs=isFav(a)?favs.filter(f=>f.link!==a.link):[a,...favs].slice(0,50);
  store.set('news-favs',favs);paintFav();paintList();
};

/* ---------- 清單面板 ---------- */
function ago(t){
  if(!t)return'時間未知';const m=Math.round((Date.now()-t)/6e4);
  if(m<1)return'剛剛';if(m<60)return m+' 分鐘前';if(m<1440)return Math.round(m/60)+' 小時前';return Math.round(m/1440)+' 天前';
}
function visible(){
  const k=keyword.trim().toLowerCase();
  const base=category==='收藏'?favs:articles.filter(a=>category==='全部'||a.category===category);
  return base.filter(a=>!k||(a.title+a.summary).toLowerCase().includes(k));
}
function buildCats(){
  const box=$('cats');box.replaceChildren();
  CATS.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed',String(c===category));
    b.onclick=()=>{category=c;buildCats();paintList()};box.append(b)});
}
function paintList(){
  const list=visible(),ul=$('list');ul.replaceChildren();
  if(!list.length){const li=document.createElement('li');li.className='empty';li.textContent=category==='收藏'?'尚未收藏。播放時按愛心即可加入。':articles.length?'沒有符合的新聞。':'尚無新聞資料。';ul.append(li);return}
  list.forEach((a,i)=>{
    const li=document.createElement('li'),b=document.createElement('button');
    b.className='item'+(queue[idx]&&queue[idx].link===a.link?' active':'');
    const m=document.createElement('small'),tag=document.createElement('span');
    tag.className='tag t-'+a.category;tag.textContent=a.category;
    m.append(tag,a.source+' · '+ago(a.time)+(isFav(a)?' · ♥':''));
    const h=document.createElement('h3');h.textContent=a.title;
    b.append(m,h);
    b.onclick=()=>{unlock();halt();queue=list.slice();idx=i;setArticle();mode='idle';speakLine();$('listDlg').close()};
    const l=document.createElement('a');l.textContent='原文';l.href=a.link;l.target='_blank';l.rel='noopener noreferrer';
    l.onclick=e=>e.stopPropagation();m.append(l);
    li.append(b);ul.append(li);
  });
}
$('q').oninput=()=>{keyword=$('q').value;paintList()};
$('menu').onclick=()=>{paintList();$('listDlg').showModal()};
$('listClose').onclick=()=>$('listDlg').close();
$('gear').onclick=()=>{diag();$('setDlg').showModal()};
$('setClose').onclick=()=>$('setDlg').close();
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
$('collapse').onclick=()=>{const on=$('player').classList.toggle('compact-on');$('collapse').setAttribute('aria-expanded',String(!on))};

/* 波形裝飾 */
(function(){const w=$('wave');let h=0.5;for(let i=0;i<34;i++){h=Math.max(.2,Math.min(1,h+(Math.random()-.5)*.7));const b=document.createElement('i');b.style.setProperty('--h',h.toFixed(2));b.style.setProperty('--d',(i*0.05%0.9).toFixed(2)+'s');w.append(b)}})();

/* 約五分鐘快訊：各類輪流取，依字數估算 */
function briefing(cats){
  const pools=cats.map(c=>articles.filter(a=>a.category===c)),out=[];let budget=0;
  for(let r=0;r<10;r++)for(const pool of pools){
    const a=pool[r];if(!a||out.length>=10)continue;
    const n=(a.title.length+a.summary.length+15)/(4*rate);
    if(budget+n>300)continue;out.push(a);budget+=n;
  }
  return out;
}
function startBrief(cats){
  unlock();halt();queue=briefing(cats);idx=0;
  if(!queue.length){status('目前沒有可播報的新聞。');return}
  setArticle();mode='idle';speakLine();$('listDlg').close();
}
$('daily').onclick=()=>startBrief(ALL4);
$('world').onclick=()=>startBrief(['全球政治','全球經濟']);

/* ---------- 載入（rss2json，失敗改用 allorigins 後備） ---------- */
function classify(a,mixed,def){
  if(!mixed)return def;
  if(def==='全球政治'&&(ECON.test(a.title)||(ECON.test(a.title+a.summary)&&!POL.test(a.title))))return'全球經濟';
  return def;
}
async function fetchJSON(url,ms){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw Error(r.status);return await r.json()}
  finally{clearTimeout(timer)}
}
function fromXML(txt){
  const d=new DOMParser().parseFromString(txt,'text/xml');
  return[...d.querySelectorAll('item')].map(i=>({title:i.querySelector('title')?.textContent,description:i.querySelector('description')?.textContent,link:i.querySelector('link')?.textContent,pubDate:i.querySelector('pubDate')?.textContent||i.getElementsByTagName('dc:date')[0]?.textContent}));
}
async function getItems(url){
  try{
    const d=await fetchJSON('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url),10000);
    if(d.status!=='ok')throw Error(d.message);return d.items;
  }catch(e){
    const d=await fetchJSON('https://api.allorigins.win/get?url='+encodeURIComponent(url),12000);
    return fromXML(d.contents);
  }
}
async function load(){
  if(loading)return;loading=true;$('refresh').disabled=true;
  $('newsStatus').textContent='更新中；已有新聞可繼續閱讀與播放。';
  let failed=0;
  const results=await Promise.all(SOURCES.map(async([source,def,url,mixed])=>{
    try{
      return(await getItems(url)).slice(0,12).map(i=>{
        const a={title:clean(i.title),summary:clean(i.description).slice(0,260),link:i.link,source,time:Date.parse(i.pubDate)||0};
        a.category=classify(a,mixed,def);return a;
      }).filter(a=>a.title&&/^https?:\/\//i.test(a.link)&&(!a.time||Date.now()-a.time<MAX_AGE));
    }catch(e){failed++;return[]}
  }));
  const seen=new Set();
  const fresh=results.flat().filter(a=>{const k=a.link,t=a.title.slice(0,18);if(seen.has(k)||seen.has(t))return false;seen.add(k);seen.add(t);return true}).sort((a,b)=>b.time-a.time);
  if(fresh.length){
    articles=fresh;store.set('news-glass-v2',{saved:Date.now(),articles});
    if(!queue.length||mode==='idle'||mode==='ended'){queue=briefing(ALL4);idx=0;setArticle()}
    paintList();
  }
  const n=c=>fresh.filter(a=>a.category===c).length;
  $('newsStatus').textContent=fresh.length
    ?`已取得 ${fresh.length} 則（政治 ${n('全球政治')}・經濟 ${n('全球經濟')}・財經 ${n('財經')}・科技 ${n('科技')}）· ${failed}/${SOURCES.length} 個來源失敗 · ${new Date().toLocaleTimeString('zh-TW')} 更新`
    :'目前無法取得新聞。'+(articles.length?'保留上次快取；不是即時新聞。':'請確認網路或稍後重試。語音測試仍可使用。');
  loading=false;$('refresh').disabled=false;
}
/* ---------- 加到主畫面提示與 Service Worker ---------- */
(function(){
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&!standalone&&!inApp&&!store.get('news-install-dismissed',false))$('install').classList.add('show');
  $('installClose').onclick=()=>{$('install').classList.remove('show');store.set('news-install-dismissed',true)};
  if('serviceWorker' in navigator&&location.protocol==='https:')
    addEventListener('load',()=>navigator.serviceWorker.register('/daily-news-sw.js',{scope:'/daily-news.html'}).catch(()=>{}));
})();
buildCats();
const cache=store.get('news-glass-v2',null);
if(cache&&Array.isArray(cache.articles)){
  articles=cache.articles;queue=briefing(ALL4);if(queue.length)setArticle();
  $('newsStatus').textContent='顯示上次快取（'+ago(cache.saved)+'），正在更新。';
}
$('refresh').onclick=load;load();
setInterval(()=>{if(document.visibilityState==='visible')load()},1800000);
</script>
