<style>
:root{
  --ivory:#FBF9F4;--sand:#F3EEE5;--sand-deep:#EBE4D7;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter','Hiragino Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--ivory);color:var(--charcoal);-webkit-font-smoothing:antialiased;touch-action:none}

/* ===== 全螢幕環景底層 ===== */
.pano{position:fixed;inset:0;overflow:hidden;background:var(--sand);cursor:grab}
.pano.dragging{cursor:grabbing}
.pano img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform,opacity;opacity:0;
  filter:saturate(1.05) contrast(1.02) brightness(1.03);
  transition:opacity .55s var(--ease)}
.pano img.ready{opacity:1}
.pano img.leaving{transition:opacity .6s var(--ease),filter .6s var(--ease);opacity:0;filter:brightness(1.28) blur(6px)}
/* 柔和光影層：低對比、暖霧 */
.grade{position:fixed;inset:0;z-index:5;pointer-events:none}
.grade::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 125% 95% at 50% 45%,transparent 62%,rgba(120,104,80,.16) 100%)}
.grade::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(251,249,244,.28) 0%,transparent 16%,transparent 82%,rgba(120,104,80,.14) 100%)}
/* 走入過場：暖白霧光 */
.flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(251,249,244,.94),rgba(251,249,244,.6) 46%,transparent 76%);opacity:0}
.flash.go{animation:stepflash .7s var(--ease)}
@keyframes stepflash{0%{opacity:0}40%{opacity:.95}100%{opacity:0}}
/* ===== Top HUD ===== */
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:30;

  background:var(--glass);backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);
  border:1px solid rgba(255,255,255,.65);border-radius:18px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);
  padding:10px 16px}
.hud-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.hud-title>div{min-width:0}
.hud-title img{width:30px;height:30px;border-radius:50%}
.hud-title h1{font-size:.86rem;font-weight:600;letter-spacing:.12em;color:var(--charcoal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.hud-title small{display:block;font-size:.58rem;font-weight:500;letter-spacing:.22em;color:var(--charcoal-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-tag{flex:0 0 auto;font-size:.58rem;font-weight:500;letter-spacing:.18em;color:var(--charcoal-soft);white-space:nowrap;transition:opacity .2s var(--ease)}
.hud-tag.dim{opacity:0}
/* ===== 中央同心圓錨點 ===== */
.anchor{position:fixed;left:50%;top:47%;transform:translate(-50%,-50%);z-index:24;display:flex;flex-direction:column;align-items:center;gap:14px}
.anchor-core{position:relative;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,253,247,.42);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75);transition:transform .2s var(--ease)}
.anchor:active .anchor-core{transform:scale(.92)}
.anchor-core::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.55);animation:breathe 3.2s var(--ease) infinite}
.anchor-core svg{width:30px;height:30px;stroke:var(--charcoal);animation:floatUp 2.3s var(--ease) infinite}
@keyframes floatUp{0%,100%{transform:translateY(3px);opacity:.7}50%{transform:translateY(-3px);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:.45}}
.anchor-label{display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.anchor-name{font-size:.9rem;font-weight:600;letter-spacing:.2em;color:var(--charcoal);
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  border:1px solid rgba(255,255,255,.65);border-radius:999px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);padding:8px 20px;white-space:nowrap}
.anchor-sub{font-size:.54rem;font-weight:500;letter-spacing:.18em;white-space:nowrap;color:rgba(255,255,255,.95);text-shadow:0 1px 8px rgba(60,50,35,.55)}
.anchor-wrap.swap{animation:riseIn .55s var(--ease)}
@keyframes riseIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
/* ===== 左右箭頭 ===== */
.step-btn{position:fixed;top:47%;transform:translateY(-50%);z-index:22;width:46px;height:46px;border-radius:50%;
  background:var(--glass-lt);border:1px solid rgba(255,255,255,.6);color:var(--charcoal);font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .2s var(--ease),background .2s var(--ease)}
.step-btn::before{content:'';position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(255,255,255,.55);animation:breathe 3.4s var(--ease) infinite}
#prevBtn::before{animation-delay:1s}
#nextBtn::before{animation-delay:2s}
.step-btn:hover{background:rgba(255,253,247,.9)}
.step-btn:active{transform:translateY(-50%) scale(.9)}
#prevBtn{left:12px}#nextBtn{right:12px}
.step-btn[disabled]{opacity:.22;pointer-events:none}
.step-btn[disabled]::before{animation:none;opacity:0}
/* ===== 拖曳提示 ===== */
.hint{position:fixed;left:50%;top:29%;transform:translate(-50%,-50%);z-index:20;display:flex;align-items:center;gap:10px;
  font-size:.74rem;font-weight:500;letter-spacing:.16em;color:var(--charcoal-soft);
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  border:1px solid rgba(255,255,255,.6);border-radius:999px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.65);
  padding:9px 18px;pointer-events:none;white-space:nowrap;transition:opacity .5s var(--ease)}
.hint.gone{opacity:0}
.hint .arr{animation:sway 1.8s var(--ease) infinite;color:var(--charcoal-faint)}
@keyframes sway{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
/* ===== 站點膠囊列 ===== */
.stops{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:28;
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px}
.stops::-webkit-scrollbar{display:none}
.stop{flex:0 0 auto;font-size:.68rem;font-weight:500;letter-spacing:.08em;color:var(--charcoal-soft);
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:8px 14px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
  transition:all .2s var(--ease)}
.stop:hover{background:rgba(255,253,247,.9)}
.stop.active{color:#fff;background:var(--sage);border-color:var(--sage)}
/* ===== Bottom Dock ===== */
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:7px;justify-content:space-between;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15);
  border:1px solid rgba(255,255,255,.65);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);
  padding:8px}
.dk{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.55);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  padding:8px 4px;color:var(--charcoal-soft);min-width:0;
  transition:all .2s var(--ease)}
.dk svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dk .lbl{font-size:.58rem;font-weight:600;letter-spacing:.1em;white-space:nowrap}
.dk:hover{background:#fff;color:var(--charcoal)}
.dk:active{transform:scale(.94)}
.dk.on{background:var(--sage);border-color:var(--sage);color:#fff}
.dk-call{background:rgba(126,148,113,.14);border-color:rgba(126,148,113,.4);color:var(--sage-deep)}
.dk-call:hover{background:var(--sage);border-color:var(--sage);color:#fff}
@media(max-width:480px){.hud-tag{font-size:.5rem;letter-spacing:.12em}.hud-title h1{letter-spacing:.06em}}
@media(min-width:769px){
  .hud{left:50%;right:auto;transform:translateX(-50%);min-width:520px;max-width:680px}
  .stops{left:50%;right:auto;transform:translateX(-50%);max-width:680px}
  .dock{left:50%;right:auto;transform:translateX(-50%);width:520px}
  .anchor-name{font-size:1rem}
}
</style>
</head>

<script>
(function(){
var SCENES=[
 {img:'images/tour/tour-1.webp',name:'大門入口',code:'ENTRANCE'},
 {img:'images/tour/tour-2.webp',name:'接待 ‧ 展示區',code:'RECEPTION'},
 {img:'images/tour/tour-3.webp',name:'會議長桌區',code:'MEETING AREA'},
 {img:'images/tour/tour-4.webp',name:'日式走廊',code:'CORRIDOR'},
 {img:'images/tour/tour-5.webp',name:'休憩交流區',code:'LOUNGE'},
 {img:'images/tour/tour-6.webp',name:'採光窗景吧台',code:'WINDOW VIEW'},
 {img:'images/tour/tour-7.webp',name:'窗邊工作區',code:'WORKSPACE'},
 {img:'images/tour/tour-8.webp',name:'迴廊 ‧ 返回入口',code:'RETURN'}
];
var pano=document.getElementById('pano'),hint=document.getElementById('hint'),
    stopsEl=document.getElementById('stops'),gyroBtn=document.getElementById('gyroBtn'),gyroLbl=document.getElementById('gyroLbl'),
    walkBtn=document.getElementById('walkBtn'),walkSub=document.getElementById('walkSub'),anchorWrap=document.getElementById('anchorWrap'),
    flash=document.getElementById('flash'),hudTag=document.getElementById('hudTag'),
    soundBtn=document.getElementById('soundBtn'),soundLbl=document.getElementById('soundLbl');
var cur=0,x=0,minX=0,imgEl=null,interacted=false,gyroOn=false,lastAlpha=null,busy=false;
var cache={},lastInteract=Date.now(),autoDir=-1;

function touch(){lastInteract=Date.now();}
function loadImg(i,cb){
  if(cache[i]){cb&&cb(cache[i]);return;}
  var im=new Image();
  im.src=SCENES[i].img;im.alt='日日好日商務中心中壢館 '+SCENES[i].name+' 環景';
  im.onload=function(){cache[i]=im;cb&&cb(im);};
}
function setX(nx){
  x=nx;if(x>0)x=0;if(x<minX)x=minX;
  if(imgEl)imgEl.style.transform='translateX('+x+'px)';
}
function fit(){
  if(!imgEl)return;
  var vw=pano.clientWidth,vh=pano.clientHeight;
  var iw=imgEl.naturalWidth*(vh/imgEl.naturalHeight);
  imgEl.style.height=vh+'px';
  minX=Math.min(0,vw-iw);
  setX(x);
}
function show(i,walk){
  if(busy)return;busy=true;touch();
  cur=i;
  hudTag.classList.add('dim');
  setTimeout(function(){
    hudTag.textContent='[ LOCATION: '+SCENES[i].code+' · '+(i+1)+'/'+SCENES.length+' ]';
    hudTag.classList.remove('dim');
  },200);
  document.getElementById('sceneName').textContent=SCENES[i].name;
  walkSub.textContent=(i===SCENES.length-1)?'RESTART ─ 輕觸重新走一圈':'TAP TO CONTINUE ─ 輕觸前往下一站';
  anchorWrap.classList.remove('swap');void anchorWrap.offsetWidth;anchorWrap.classList.add('swap');
  document.getElementById('prevBtn').disabled=(i===0);
  document.getElementById('nextBtn').disabled=(i===SCENES.length-1);
  Array.prototype.forEach.call(stopsEl.children,function(c,j){c.classList.toggle('active',j===i);});
  var act=stopsEl.children[i];if(act&&act.scrollIntoView)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  if(walk&&imgEl){
    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
    var old=imgEl;old.classList.add('leaving');
    setTimeout(function(){old.remove();},680);
    imgEl=null;
  }
  loadImg(i,function(im){
    if(imgEl)imgEl.remove();
    imgEl=im.cloneNode();imgEl.className='';
    pano.appendChild(imgEl);
    var vw=pano.clientWidth,vh=pano.clientHeight;
    var iw=im.naturalWidth*(vh/im.naturalHeight);
    x=(vw-iw)/2;
    fit();
    autoDir=(Math.random()<.5)?-1:1;
    requestAnimationFrame(function(){imgEl.classList.add('ready');busy=false;});
    if(i+1<SCENES.length)loadImg(i+1);
    if(i-1>=0)loadImg(i-1);
  });
}
// 站點膠囊
SCENES.forEach(function(s,i){
  var b=document.createElement('button');b.className='stop';b.textContent=(i+1)+' ‧ '+s.name;
  b.addEventListener('click',function(){tryMusic();show(i,true);});
  stopsEl.appendChild(b);
});
// 中央錨點：前往下一站
walkBtn.addEventListener('click',function(){
  tryMusic();
  if(cur<SCENES.length-1)show(cur+1,true);else show(0,true);
});
// 拖曳
var dragging=false,sx=0,ox=0,vx=0,lastT=0,lastX=0,raf=null;
function onDown(e){
  if(e.target.closest&&e.target.closest('button,a,nav,header'))return;
  dragging=true;pano.classList.add('dragging');touch();
  sx=(e.touches?e.touches[0].clientX:e.clientX);ox=x;vx=0;lastT=Date.now();lastX=sx;
  if(!interacted){interacted=true;hint.classList.add('gone');}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function onMove(e){
  if(!dragging)return;touch();
  var cx=(e.touches?e.touches[0].clientX:e.clientX);
  var now=Date.now();if(now-lastT>16){vx=(cx-lastX)/(now-lastT);lastT=now;lastX=cx;}
  setX(ox+(cx-sx));
}
function onUp(){
  if(!dragging)return;dragging=false;pano.classList.remove('dragging');touch();
  var v=vx*14;
  (function glide(){
    if(Math.abs(v)<.5)return;
    touch();setX(x+v);v*=.93;if(x>=0||x<=minX)v=0;
    raf=requestAnimationFrame(glide);
  })();
}
document.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
document.addEventListener('touchstart',onDown,{passive:true});
document.addEventListener('touchmove',onMove,{passive:true});
document.addEventListener('touchend',onUp);
// 前後站
document.getElementById('prevBtn').addEventListener('click',function(){tryMusic();if(cur>0)show(cur-1,true);});
document.getElementById('nextBtn').addEventListener('click',function(){tryMusic();if(cur<SCENES.length-1)show(cur+1,true);});
// 自動環顧漂移
(function drift(){
  if(imgEl&&!dragging&&!busy&&!gyroOn&&Date.now()-lastInteract>2600&&minX<0){
    x+=autoDir*.34;
    if(x<=minX){x=minX;autoDir=1;}
    if(x>=0){x=0;autoDir=-1;}
    imgEl.style.transform='translateX('+x+'px)';
  }
  requestAnimationFrame(drift);
})();
// 背景音樂：Web Audio 無縫循環，音量 31%
var actx=null,musicBuf=null,srcNode=null,gainNode=null,musicOn=false,musicLoading=false,musicFailed=false;
function updateSound(){
  soundLbl.textContent=musicOn?'播放中':'背景音樂';
  soundBtn.classList.toggle('on',musicOn);
}
function startMusic(){
  if(!actx||!musicBuf||musicOn)return;
  srcNode=actx.createBufferSource();
  srcNode.buffer=musicBuf;srcNode.loop=true;
  gainNode=actx.createGain();gainNode.gain.value=.31;
  srcNode.connect(gainNode).connect(actx.destination);
  srcNode.start(0);musicOn=true;updateSound();
}
function stopMusic(){
  if(srcNode){try{srcNode.stop();}catch(e){}srcNode=null;}
  musicOn=false;updateSound();
}
function tryMusic(){
  if(musicOn||musicFailed)return;
  if(!actx){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){musicFailed=true;return;}
    actx=new AC();
  }
  if(actx.state==='suspended')actx.resume();
  if(musicBuf){startMusic();return;}
  if(musicLoading)return;
  musicLoading=true;
  fetch('music/tour-bgm.mp3').then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.arrayBuffer();
  }).then(function(ab){
    return actx.decodeAudioData(ab);
  }).then(function(buf){
    musicBuf=buf;startMusic();
  }).catch(function(){musicFailed=true;updateSound();});
}
soundBtn.addEventListener('click',function(){
  if(musicOn)stopMusic();else tryMusic();
});
// 體感模式
function onOrient(e){
  if(!gyroOn||e.alpha==null)return;
  if(lastAlpha==null){lastAlpha=e.alpha;return;}
  var d=e.alpha-lastAlpha;
  if(d>180)d-=360;if(d<-180)d+=360;
  lastAlpha=e.alpha;
  touch();setX(x+d*7);
  if(!interacted&&Math.abs(d)>.5){interacted=true;hint.classList.add('gone');}
}
gyroBtn.addEventListener('click',function(){
  tryMusic();
  if(gyroOn){gyroOn=false;lastAlpha=null;gyroBtn.classList.remove('on');gyroLbl.textContent='體感模式';return;}
  function enable(){gyroOn=true;gyroBtn.classList.add('on');gyroLbl.textContent='體感中';window.addEventListener('deviceorientation',onOrient);}
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')enable();}).catch(function(){});
  }else{enable();}
});
window.addEventListener('resize',fit);
show(0);
})();
</script>
