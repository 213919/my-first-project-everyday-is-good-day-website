  <button class="dk on" id="soundBtn">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span class="lbl" id="soundLbl">音樂 ON</span>
  </button>
</nav>

<script>
(function(){
'use strict';
var SCENES=[
 {img:'images/tour/tour-1.webp',name:'大門入口',code:'01 · ENTRANCE',desc:'推開門,日日好日的一天從這裡開始。'},
 {img:'images/tour/tour-2.webp',name:'接待 ‧ 展示區',code:'02 · RECEPTION',desc:'溫潤木質的接待區,給訪客的第一印象。'},
 {img:'images/tour/tour-3.webp',name:'會議長桌區',code:'03 · MEETING AREA',desc:'辦公室租客免費使用開會區域。'},
 {img:'images/tour/tour-4.webp',name:'日式走廊',code:'04 · CORRIDOR',desc:'安靜的日式廊道,串起每一間辦公室。'},
 {img:'images/tour/tour-5.webp',name:'休憩交流區',code:'05 · LOUNGE',desc:'工作之間,留一段喘息與交流的時光。'},
 {img:'images/tour/tour-6.webp',name:'採光窗景吧台',code:'06 · WINDOW VIEW',desc:'面窗吧台,把城市天際線借進辦公室。'},
 {img:'images/tour/tour-7.webp',name:'窗邊工作區',code:'07 · WORKSPACE',desc:'自然採光的窗邊座位,效率與舒適兼得。'},
 {img:'images/tour/tour-8.webp',name:'迴廊 ‧ 返回入口',code:'08 · RETURN',desc:'走完一圈,歡迎預約實地參觀。'}
];
var TRAVEL=1.5;                 // 每個場景佔用的捲動距離(視窗高度倍數)
var N=SCENES.length;
var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var journey=document.getElementById('journey'),
    stage=document.getElementById('stage'),
    intro=document.getElementById('intro'),
    hud=document.getElementById('hud'),hudTag=document.getElementById('hudTag'),
    rail=document.getElementById('rail'),
    bar=document.getElementById('bar');

/* --- 建立圖層與字幕(先進場景疊在上層,淡出後露出下一景) --- */
var layers=[],caps=[],dots=[],loaded=[],dims=[];
SCENES.forEach(function(s,i){
  var ly=document.createElement('div');ly.className='layer';ly.style.zIndex=String(N-i);
  var im=document.createElement('img');
  im.alt='日日好日商務中心中壢館 '+s.name+' 環景';
  im.decoding='async';
  im.addEventListener('load',function(){fitLayer(i);onScroll();});
  if(i===0){im.fetchPriority='high';im.src=s.img;loaded[0]=true;}   // 首圖優先,其餘接近時才載入
  ly.appendChild(im);
  stage.insertBefore(ly,stage.firstChild);
  layers[i]=ly;

  var cap=document.createElement('div');cap.className='cap';
  cap.innerHTML='<span class="code">'+s.code+'</span><h2>'+s.name+'</h2><p>'+s.desc+'</p>';
  stage.appendChild(cap);
  caps[i]=cap;

  var dot=document.createElement('button');
  dot.setAttribute('aria-label',s.name);
  dot.addEventListener('click',function(){
    tryMusic();
    var top=journeyTop+((i*TRAVEL+0.45*TRAVEL)*vh);
    window.scrollTo({top:top,behavior:reduceMotion?'auto':'smooth'});
  });
  rail.appendChild(dot);
  dots[i]=dot;
});

function ensureLoaded(i){
  if(i<0||i>=N||loaded[i])return;
  loaded[i]=true;
  layers[i].firstChild.src=SCENES[i].img;
}

/* --- 幾何量測 --- */
var vh=window.innerHeight,journeyTop=0,journeyScroll=1,stageW=0,stageH=0;
function fitLayer(i){
  /* 依舞台高度等比縮放,保留完整橫幅寬度供環景橫掃 */
  var im=layers[i].firstChild;
  if(!im.naturalWidth||reduceMotion)return;
  var w=im.naturalWidth*(stageH/im.naturalHeight),h=stageH;
  if(w<stageW){h=im.naturalHeight*(stageW/im.naturalWidth);w=stageW;}  // 窄圖改以寬度鋪滿
  dims[i]={w:w,h:h};
  im.classList.add('fitted');
  im.style.width=w+'px';im.style.height=h+'px';
}
function measure(){
  vh=window.innerHeight;
  stageW=stage.clientWidth;stageH=stage.clientHeight;
  journey.style.height=((N*TRAVEL*vh)+vh)+'px';
  var r=journey.getBoundingClientRect();
  journeyTop=r.top+(window.pageYOffset||document.documentElement.scrollTop);
  journeyScroll=N*TRAVEL*vh;   // sticky 可捲動的距離
  for(var i=0;i<N;i++)fitLayer(i);
}
measure();

var clamp=function(v,a,b){return v<a?a:(v>b?b:v)};
var lastIdx=-1,hudOn=false,ticking=false;

function render(){
  ticking=false;
  var y=(window.pageYOffset||document.documentElement.scrollTop)-journeyTop;
  var g=clamp(y/journeyScroll,0,1);        // 全程進度 0~1
  var f=g*N;                               // 場景座標(含小數)
  var idx=clamp(Math.floor(f),0,N-1);

  bar.style.transform='scaleX('+g+')';

  /* 開場遮罩:第一景前 45% 內淡出 */
  var ip=clamp(f/0.45,0,1);
  intro.style.opacity=String(1-ip);
  if(!reduceMotion)intro.style.transform='translateY('+(-ip*8)+'vh)';
  intro.style.visibility=(ip>=1)?'hidden':'visible';

  var showHud=f>0.3&&g<1;
  if(showHud!==hudOn){hudOn=showHud;hud.classList.toggle('show',showHud);rail.classList.toggle('show',showHud);}

  ensureLoaded(idx);ensureLoaded(idx+1);ensureLoaded(idx+2);

  for(var i=0;i<N;i++){
    var d=f-i;                             // 該場景的局部進度
    var ly=layers[i];
    if(d<=-1.2||d>=1.35){ly.style.opacity='0';caps[i].style.opacity='0';continue;}

    /* 圖層:自己的時段內全亮,最後 22% 淡出並提亮(走入光暈),交棒給下一景。
       最後一景沒有下一景,維持全亮直到舞台捲離。 */
    var isLast=(i===N-1);
    var o;
    if(d<0)o=1;                            // 還在下層待命
    else if(isLast||d<=0.78)o=1;
    else o=1-clamp((d-0.78)/0.22,0,1);
    ly.style.opacity=String(o);

    if(!reduceMotion){
      /* 環景橫掃:整段時段內從照片一端掃到另一端,逐景交替方向;
         同時輕微推進,像邊走邊環顧四周 */
      var im=ly.firstChild,dm=dims[i];
      var pp=clamp(d,0,1);
      var push=1.04+0.10*pp;                        // 輕推進(橫掃是主角)
      if(d<0)push=1.04;
      if(dm){
        var ease=pp*pp*(3-2*pp);                    // smoothstep,起訖平緩
        var E=Math.max(0,(dm.w*push-stageW)/2);     // 中心可位移的最大距離
        var dir=(i%2===0)?1:-1;
        var tx=dir*E*(1-2*ease);                    // +E → -E(或反向)
        var Ey=Math.max(0,(dm.h*push-stageH)/2);
        im.style.transform='translate(-50%,-50%) translate('+tx+'px,'+(Ey*0.3*(1-2*ease))+'px) scale('+push+')';
      }else{
        im.style.transform='scale('+push+')';
      }
      var glow=isLast?0:clamp((d-0.78)/0.22,0,1);
      ly.style.filter=glow>0
        ?'saturate(1.05) contrast(1.02) brightness('+(1.03+glow*0.55)+') blur('+(glow*5)+'px)'
        :'saturate(1.05) contrast(1.02) brightness(1.03)';
    }

    /* 字幕:中段浮現,速度與影像不同(視差) */
    var co=clamp((d-0.1)/0.14,0,1)*(1-clamp((d-0.62)/0.16,0,1));
    caps[i].style.opacity=String(co);
    if(!reduceMotion)caps[i].style.transform='translateY('+(34-clamp(d,0,1)*68)+'px)';
  }

  if(idx!==lastIdx&&f>0.12){
    lastIdx=idx;
    hudTag.textContent='[ '+SCENES[idx].code+' · '+(idx+1)+'/'+N+' ]';
    dots.forEach(function(dt,j){dt.classList.toggle('on',j===idx);});
  }
}

function onScroll(){
  if(!ticking){ticking=true;requestAnimationFrame(render);}
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){measure();onScroll();});
window.addEventListener('orientationchange',function(){setTimeout(function(){measure();onScroll();},250);});
render();

/* ===== 滑鼠點擊推進:點畫面(或 START)前往下一站 ===== */
function advance(){
  tryMusic();
  var y=(window.pageYOffset||document.documentElement.scrollTop)-journeyTop;
  var f=clamp(y/journeyScroll,0,1)*N;
  var next=(f<0.4)?0:Math.floor(f)+1;
  if(next>=N){
    document.querySelector('.outro').scrollIntoView({behavior:reduceMotion?'auto':'smooth'});
    return;
  }
  window.scrollTo({top:journeyTop+((next*TRAVEL+0.45*TRAVEL)*vh),behavior:reduceMotion?'auto':'smooth'});
}
stage.addEventListener('click',advance);

/* 首屏就緒後再補第二景,避免搶首圖頻寬 */
window.addEventListener('load',function(){
  setTimeout(function(){ensureLoaded(1);},1200);
});

/* ===== 背景音樂:<audio> 媒體播放 =====
   改用媒體元素而非 Web Audio:iPhone 靜音鍵撥到靜音時 Web Audio 會被整個消音,
   媒體播放則照常出聲。iOS 不允許 JS 調整音量,因此 31% 音量已烘焙進音檔。 */
var soundBtn=document.getElementById('soundBtn'),soundLbl=document.getElementById('soundLbl');
var bgm=new Audio('music/tour-bgm-soft.mp3');
bgm.loop=true;bgm.preload='none';   // 不搶首屏頻寬,首次手勢才載入
bgm.setAttribute('playsinline','');
var userMuted=false;
function updateSound(){
  var wantOn=!userMuted;
  soundLbl.textContent=wantOn?'音樂 ON':'音樂 OFF';
  soundBtn.classList.toggle('on',wantOn);
}
function tryMusic(){
  if(userMuted||!bgm.paused)return;
  var p=bgm.play();
  if(p&&p.catch)p.catch(function(){});   // 首次手勢前會被擋下,交由解鎖事件重試
}
soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  /* 依「實際是否出聲」切換:靜音狀態下點擊一律視為開啟 */
  if(bgm.paused){userMuted=false;tryMusic();}
  else{userMuted=true;bgm.pause();}
  updateSound();
});
/* 進頁先試播(桌機多半可直接播);手機於首次手勢(touchend/pointerup)解鎖 */
setTimeout(tryMusic,900);
/* 首屏就緒後預熱音檔,讓首次手勢能立刻出聲 */
window.addEventListener('load',function(){
  setTimeout(function(){if(bgm.paused){bgm.preload='auto';try{bgm.load();}catch(e){}}},2600);
});
['pointerup','touchend','click','keydown'].forEach(function(ev){
  document.addEventListener(ev,tryMusic,{passive:true});
});
updateSound();
})();
</script>
</body>
</html>
