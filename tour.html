<style>
:root{--brand:#2D5016;--brand-deep:#1E3A0F;--off-white:#F7F3EE;--gray:#F4EEE7;--text:#5E5148;--text-sub:#7A6F67;--border:#D8CFC5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',Arial,sans-serif;background:#fff;color:var(--text);-webkit-font-smoothing:antialiased;touch-action:none}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff}
/* 頂欄（白）*/
.tbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(255,252,248,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);z-index:30}
.tbar img{width:34px;height:34px;border-radius:50%}
.tbar-title{flex:1;min-width:0}
.tbar-title h1{font-size:.92rem;font-weight:700;letter-spacing:.04em;color:var(--brand);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.tbar-title span{display:block;font-size:.64rem;color:var(--text-sub);letter-spacing:.08em}
.tbar-step{flex:0 0 auto;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--gray);padding:6px 12px;border-radius:999px;white-space:nowrap}
/* 環景視窗 */
.pano{flex:1 1 auto;position:relative;overflow:hidden;background:#EFE8DE;cursor:grab}
.pano.dragging{cursor:grabbing}
.pano img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform,opacity;opacity:0;
  filter:saturate(1.09) contrast(1.05) brightness(1.03);
  transition:opacity .55s ease}
.pano img.ready{opacity:1}
.pano img.leaving{transition:opacity .62s ease,filter .62s ease;opacity:0;filter:saturate(1.15) contrast(1.06) brightness(1.35) blur(6px)}
/* 光影潤色層 */
.grade{position:absolute;inset:0;z-index:5;pointer-events:none}
.grade::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 118% 88% at 50% 46%,transparent 58%,rgba(30,22,12,.28) 100%)}
.grade::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(30,22,12,.2) 0%,transparent 12%,transparent 80%,rgba(30,22,12,.38) 100%),
  linear-gradient(115deg,rgba(255,238,205,.07) 0%,transparent 34%)}
/* 走入下一站的白光過場 */
.flash{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,250,240,.9),rgba(255,250,240,.55) 45%,transparent 75%);opacity:0}
.flash.go{animation:stepflash .72s ease}
@keyframes stepflash{0%{opacity:0}38%{opacity:.92}100%{opacity:0}}
/* 場景資訊 */
.scene-info{position:absolute;left:16px;bottom:18px;z-index:20;pointer-events:none}
.scene-info.swap{animation:riseIn .6s ease}
@keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
.scene-name{font-size:1.18rem;font-weight:700;letter-spacing:.05em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.scene-desc{font-size:.78rem;color:rgba(255,255,255,.9);margin-top:3px;text-shadow:0 1px 8px rgba(0,0,0,.7);max-width:70vw}
/* 拖曳提示 */
.hint{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:20;display:flex;align-items:center;gap:10px;font-size:.82rem;letter-spacing:.1em;color:#fff;background:rgba(30,22,12,.45);padding:11px 20px;border-radius:999px;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hint.gone{opacity:0}
.hint .arr{animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
/* 脈動光圈（共用）*/
@keyframes pulse{0%{transform:scale(.82);opacity:0}28%{opacity:.85}100%{transform:scale(1.22);opacity:0}}
/* 中央前進懸浮鈕 */
.walk{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:24;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none}
.walk-ring{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,252,246,.16);border:1.6px solid rgba(255,255,255,.8);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 4px 26px rgba(0,0,0,.32),inset 0 0 18px rgba(255,255,255,.12);transition:transform .18s}
.walk:active .walk-ring{transform:scale(.9)}
.walk-ring::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.4px solid rgba(255,255,255,.5);animation:pulse 2.1s ease-out infinite}
.walk-ring svg{width:26px;height:26px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.walk-label{font-size:.72rem;font-weight:700;letter-spacing:.16em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.8);background:rgba(30,22,12,.35);padding:4px 13px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.walk.end .walk-ring{background:rgba(45,80,22,.55);border-color:rgba(216,232,200,.95)}
/* 左右站按鈕（同款脈動）*/
.step-btn{position:absolute;top:46%;transform:translateY(-50%);z-index:22;width:48px;height:48px;border-radius:50%;
  background:rgba(255,252,246,.16);border:1.6px solid rgba(255,255,255,.8);color:#fff;font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .18s}
.step-btn::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1.3px solid rgba(255,255,255,.5);animation:pulse 2.1s ease-out infinite}
#prevBtn::before{animation-delay:.7s}
#nextBtn::before{animation-delay:1.4s}
.step-btn:active{transform:translateY(-50%) scale(.9)}
#prevBtn{left:12px}#nextBtn{right:12px}
.step-btn[disabled]{opacity:.25;pointer-events:none}
.step-btn[disabled]::before{animation:none;opacity:0}
/* 站點列（白）*/
.stops{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;border-top:1px solid var(--border);scrollbar-width:none;z-index:30}
.stops::-webkit-scrollbar{display:none}
.stop{flex:0 0 auto;font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--text-sub);background:var(--gray);border:1px solid var(--border);border-radius:999px;padding:7px 13px;white-space:nowrap;transition:all .2s}
.stop.active{color:#fff;background:var(--brand);border-color:var(--brand)}
/* 底部整合功能列（白）*/
.funcbar{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);z-index:30}
.fn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-sub);min-width:56px;padding:4px 6px}
.fn .ico{font-size:1.22rem;line-height:1.25}
.fn .lbl{font-size:.62rem;font-weight:700;letter-spacing:.08em}
.fn.on{color:var(--brand)}
.fn:active{transform:scale(.92)}
/* 來電：中央強調圓鈕 */
.fn-call{position:relative;margin-top:-22px}
.fn-call .ico{width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.35rem;box-shadow:0 8px 20px rgba(45,80,22,.38);border:3px solid #fff}
.fn-call .lbl{color:var(--brand)}
@media(min-width:769px){.scene-name{font-size:1.5rem}.scene-info{left:28px;bottom:24px}.walk{bottom:18%}}
</style>
</head>

<div class="stage">
  <header class="tbar">

      </span>

  </nav>
</div>

<script>
(function(){
var SCENES=[
 {img:'images/tour/tour-1.webp',name:'入口・接待區',desc:'推開大門的第一眼，溫暖木質接待空間'},
 {img:'images/tour/tour-2.webp',name:'館內主通道',desc:'沿著木地板往館內前進'},
 {img:'images/tour/tour-3.webp',name:'日式走廊',desc:'暖簾與窗格，經過獨立辦公室與會議空間'},
 {img:'images/tour/tour-4.webp',name:'走廊底端',desc:'安靜的辦公廊道，每一間都是獨立空間'},
 {img:'images/tour/tour-5.webp',name:'休憩交流區',desc:'茶水、事務設備與交流空間'},
 {img:'images/tour/tour-6.webp',name:'採光窗景',desc:'落地窗吧台座位，眺望中壢城市景觀'},
 {img:'images/tour/tour-7.webp',name:'迴廊轉角',desc:'繞行全館，處處是採光與綠意'},
 {img:'images/tour/tour-8.webp',name:'返回入口',desc:'一圈走完，歡迎親自來感受'}
];
var pano=document.getElementById('pano'),hint=document.getElementById('hint'),
    stopsEl=document.getElementById('stops'),gyroBtn=document.getElementById('gyroBtn'),gyroLbl=document.getElementById('gyroLbl'),
    walkBtn=document.getElementById('walkBtn'),walkLabel=document.getElementById('walkLabel'),
    flash=document.getElementById('flash'),sceneInfo=document.getElementById('sceneInfo'),
    soundBtn=document.getElementById('soundBtn'),soundIco=document.getElementById('soundIco'),soundLbl=document.getElementById('soundLbl');
var cur=0,x=0,minX=0,imgEl=null,interacted=false,gyroOn=false,lastAlpha=null,busy=false;
var cache={},lastInteract=Date.now(),autoDir=-1;

function touch(){lastInteract=Date.now();}
function loadImg(i,cb){
  if(cache[i]){cb&&cb(cache[i]);return;}
  var im=new Image();
  im.src=SCENES[i].img;im.alt='日日好日商務中心中壢館 '+SCENES[i].name+' 環景';
  im.onload=function(){cache[i]=im;cb&&cb(im);};
}
function setX(nx){
  x=nx;if(x>0)x=0;if(x<minX)x=minX;
  if(imgEl)imgEl.style.transform='translateX('+x+'px)';
}
function fit(){
  if(!imgEl)return;
  var vw=pano.clientWidth,vh=pano.clientHeight;
  var iw=imgEl.naturalWidth*(vh/imgEl.naturalHeight);
  imgEl.style.height=vh+'px';
  minX=Math.min(0,vw-iw);
  setX(x);
}
function show(i,walk){
  if(busy)return;busy=true;touch();
  cur=i;
  document.getElementById('sceneStep').textContent=(i+1)+' / '+SCENES.length;
  document.getElementById('sceneName').textContent=SCENES[i].name;
  document.getElementById('sceneDesc').textContent=SCENES[i].desc;
  sceneInfo.classList.remove('swap');void sceneInfo.offsetWidth;sceneInfo.classList.add('swap');
  document.getElementById('prevBtn').disabled=(i===0);
  document.getElementById('nextBtn').disabled=(i===SCENES.length-1);
  walkLabel.textContent=(i===SCENES.length-1)?'重新走一圈':'往下一站';
  walkBtn.classList.toggle('end',i===SCENES.length-1);
  Array.prototype.forEach.call(stopsEl.children,function(c,j){c.classList.toggle('active',j===i);});
  var act=stopsEl.children[i];if(act&&act.scrollIntoView)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  if(walk&&imgEl){
    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
    var old=imgEl;old.classList.add('leaving');
    setTimeout(function(){old.remove();},700);
    imgEl=null;
  }
  loadImg(i,function(im){
    if(imgEl)imgEl.remove();
    imgEl=im.cloneNode();imgEl.className='';
    pano.insertBefore(imgEl,pano.firstChild);
    var vw=pano.clientWidth,vh=pano.clientHeight;
    var iw=im.naturalWidth*(vh/im.naturalHeight);
    x=(vw-iw)/2;
    fit();
    autoDir=(Math.random()<.5)?-1:1;
    requestAnimationFrame(function(){imgEl.classList.add('ready');busy=false;});
    if(i+1<SCENES.length)loadImg(i+1);
    if(i-1>=0)loadImg(i-1);
  });
}
// 站點列
SCENES.forEach(function(s,i){
  var b=document.createElement('button');b.className='stop';b.textContent=(i+1)+'. '+s.name;
  b.addEventListener('click',function(){tryMusic();show(i,true);});
  stopsEl.appendChild(b);
});
// 中央前進鈕
walkBtn.addEventListener('click',function(){
  tryMusic();
  if(cur<SCENES.length-1)show(cur+1,true);else show(0,true);
});
// 拖曳
var dragging=false,sx=0,ox=0,vx=0,lastT=0,lastX=0,raf=null;
function onDown(e){
  if(e.target.closest&&e.target.closest('button,a'))return;
  dragging=true;pano.classList.add('dragging');touch();
  sx=(e.touches?e.touches[0].clientX:e.clientX);ox=x;vx=0;lastT=Date.now();lastX=sx;
  if(!interacted){interacted=true;hint.classList.add('gone');}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function onMove(e){
  if(!dragging)return;touch();
  var cx=(e.touches?e.touches[0].clientX:e.clientX);
  var now=Date.now();if(now-lastT>16){vx=(cx-lastX)/(now-lastT);lastT=now;lastX=cx;}
  setX(ox+(cx-sx));
}
function onUp(){
  if(!dragging)return;dragging=false;pano.classList.remove('dragging');touch();
  var v=vx*14;
  (function glide(){
    if(Math.abs(v)<.5)return;
    touch();setX(x+v);v*=.93;if(x>=0||x<=minX)v=0;
    raf=requestAnimationFrame(glide);
  })();
}
pano.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
pano.addEventListener('touchstart',onDown,{passive:true});
pano.addEventListener('touchmove',onMove,{passive:true});
pano.addEventListener('touchend',onUp);
// 前後站
document.getElementById('prevBtn').addEventListener('click',function(){tryMusic();if(cur>0)show(cur-1,true);});
document.getElementById('nextBtn').addEventListener('click',function(){tryMusic();if(cur<SCENES.length-1)show(cur+1,true);});
// 自動環顧漂移：閒置 2.6 秒後緩慢左右巡視
(function drift(){
  if(imgEl&&!dragging&&!busy&&!gyroOn&&Date.now()-lastInteract>2600&&minX<0){
    x+=autoDir*.34;
    if(x<=minX){x=minX;autoDir=1;}
    if(x>=0){x=0;autoDir=-1;}
    imgEl.style.transform='translateX('+x+'px)';
  }
  requestAnimationFrame(drift);
})();
// 背景音樂：Web Audio 無縫循環，音量 31%
var actx=null,musicBuf=null,srcNode=null,gainNode=null,musicOn=false,musicLoading=false,musicFailed=false;
function updateSound(){
  soundIco.textContent=musicOn?'🔊':'🔇';
  soundLbl.textContent=musicOn?'音樂中':'音樂';
  soundBtn.classList.toggle('on',musicOn);
}
function startMusic(){
  if(!actx||!musicBuf||musicOn)return;
  srcNode=actx.createBufferSource();
  srcNode.buffer=musicBuf;srcNode.loop=true;
  gainNode=actx.createGain();gainNode.gain.value=.31;
  srcNode.connect(gainNode).connect(actx.destination);
  srcNode.start(0);musicOn=true;updateSound();
}
function stopMusic(){
  if(srcNode){try{srcNode.stop();}catch(e){}srcNode=null;}
  musicOn=false;updateSound();
}
function tryMusic(){
  if(musicOn||musicFailed)return;
  if(!actx){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){musicFailed=true;return;}
    actx=new AC();
  }
  if(actx.state==='suspended')actx.resume();
  if(musicBuf){startMusic();return;}
  if(musicLoading)return;
  musicLoading=true;
  fetch('music/tour-bgm.mp3').then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.arrayBuffer();
  }).then(function(ab){
    return actx.decodeAudioData(ab);
  }).then(function(buf){
    musicBuf=buf;startMusic();
  }).catch(function(){musicFailed=true;updateSound();});
}
soundBtn.addEventListener('click',function(){
  if(musicOn)stopMusic();else tryMusic();
});
// 體感模式
function onOrient(e){
  if(!gyroOn||e.alpha==null)return;
  if(lastAlpha==null){lastAlpha=e.alpha;return;}
  var d=e.alpha-lastAlpha;
  if(d>180)d-=360;if(d<-180)d+=360;
  lastAlpha=e.alpha;
  touch();setX(x+d*7);
  if(!interacted&&Math.abs(d)>.5){interacted=true;hint.classList.add('gone');}
}
gyroBtn.addEventListener('click',function(){
  tryMusic();
  if(gyroOn){gyroOn=false;lastAlpha=null;gyroBtn.classList.remove('on');gyroLbl.textContent='體感模式';return;}
  function enable(){gyroOn=true;gyroBtn.classList.add('on');gyroLbl.textContent='體感中';window.addEventListener('deviceorientation',onOrient);}
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')enable();}).catch(function(){});
  }else{enable();}
});
window.addEventListener('resize',fit);
show(0);
})();
</script>
